<script>
const K="ph_demo";let ps=JSON.parse(localStorage.getItem(K)||"[]"),cur=-1;
const fmt=n=>Number(n||0).toLocaleString("sk-SK",{minimumFractionDigits:2,maximumFractionDigits:2});
const D=s=>{let[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)},iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`};
const sd=s=>D(s).toLocaleDateString("sk-SK"),dn=s=>["Ne","Po","Ut","St","Št","Pi","So"][D(s).getDay()];
const dayClass=s=>D(s).getDay()===0?"sun":"";
function save(){localStorage.setItem(K,JSON.stringify(ps))}
function days(a,b){let r=[],d=D(a),e=D(b);while(d<=e){r.push({date:iso(d),hours:0});d.setDate(d.getDate()+1)}return r}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function annualFreeSummary(){
 const dates={};
 ps.forEach(x=>x.days.forEach(d=>{dates[d.date]=(dates[d.date]||0)+(+d.hours||0)}));
 const years=new Set([String(new Date().getFullYear()),...Object.keys(dates).map(date=>date.slice(0,4))]);
 return [...years].sort().map(year=>{
  const worked=Object.entries(dates).filter(([date,hours])=>date.startsWith(year)&&hours>0).length;
  const daysInYear=(new Date(+year+1,0,1)-new Date(+year,0,1))/86400000;
  return {year,worked,free:daysInYear-worked};
 });
}

function flagFor(name){const s=(name||"").toLowerCase();if(/swe|sweden|švéd|halmstad|kungälv|kungens/.test(s))return "🇸🇪";if(/fi|finland|turku/.test(s))return "🇫🇮";if(/es|spain|špan|pamplona|málaga|malaga/.test(s))return "🇪🇸";if(/nor|nór|askim|oslo/.test(s))return "🇳🇴";if(/nl|nether|holand|maastricht|waalwijk|arnhem/.test(s))return "🇳🇱";if(/de|german|braunschweig/.test(s))return "🇩🇪";if(/dubai|uae|emir/.test(s))return "🇦🇪";return "🌍"}
let calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function shiftCalendar(delta){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+delta,1);calendarView()}
function calendarView(){header("Kalendár");const year=calendarCursor.getFullYear(),month=calendarCursor.getMonth(),first=new Date(year,month,1),last=new Date(year,month+1,0),names=["Ne","Po","Ut","St","Št","Pi","So"];let html="";for(let i=0;i<first.getDay();i++)html+='<div class="calendarBlank"></div>';for(let day=1;day<=last.getDate();day++){const key=year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");const entries=ps.map((p,i)=>({p,i,d:p.days.find(d=>d.date===key)})).filter(x=>x.d);const hours=entries.reduce((a,x)=>a+(+x.d.hours||0),0);const chips=entries.map(x=>`<button class="calendarProject" onclick="event.stopPropagation();openP(${x.i})" title="${esc(x.p.name)}">${flagFor(x.p.country||x.p.name)} ${esc(x.p.name)} · ${fmt(+x.d.hours||0)} h</button>`).join("");html+=`<div class="calendarDay ${hours?"hasHours":""} ${new Date(year,month,day).getDay()===0?"sunday":""}"><b>${day}</b><span>${hours?fmt(hours)+" h spolu":"—"}</span><div class="calendarEntries">${chips}</div></div>`}app.innerHTML=`<section class="projectsPanel calendarPanel"><div class="calendarToolbar"><button class="calendarArrow" onclick="shiftCalendar(-1)" aria-label="Predchádzajúci mesiac">‹</button><div><h2>${first.toLocaleDateString("sk-SK",{month:"long",year:"numeric"})}</h2><span class="muted">Prehľad hodín a projektov podľa dní</span></div><button class="calendarArrow" onclick="shiftCalendar(1)" aria-label="Nasledujúci mesiac">›</button><button class="calendarToday" onclick="calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);calendarView()">Dnes</button></div><div class="calendarGrid">${names.map(n=>`<b class="calendarName">${n}</b>`).join("")}${html}</div><div class="calendarLegend"><span><i class="legendDot worked"></i> Evidovaný projekt</span><span><i class="legendDot sundayDot"></i> Nedeľa</span><span>Kliknutím na projekt otvoríš jeho dennú evidenciu</span></div></section>`}
function statsView(){header("Štatistiky");let hours=0,earn=0,worked=0;ps.forEach(p=>p.days.forEach(d=>{let h=+d.hours||0;hours+=h;earn+=h*p.rate;if(h>0)worked++}));const sorted=[...ps].sort((a,b)=>b.days.reduce((s,d)=>s+(+d.hours||0),0)-a.days.reduce((s,d)=>s+(+d.hours||0),0));app.innerHTML=`<section class="projectsPanel"><div class="panelHeading"><h2>Štatistiky práce</h2></div><div class="metricGrid"><div class="metricCard"><span class="metricLabel">Hodiny spolu</span><strong>${fmt(hours)} h</strong></div><div class="metricCard"><span class="metricLabel">Zárobok spolu</span><strong>${fmt(earn)} €</strong></div><div class="metricCard"><span class="metricLabel">Odpracované dni</span><strong>${worked}</strong></div><div class="metricCard"><span class="metricLabel">Počet projektov</span><strong>${ps.length}</strong></div></div><div class="statsList">${sorted.map(p=>{let h=p.days.reduce((s,d)=>s+(+d.hours||0),0);return `<div class="detailMetric"><span>${esc(p.name)}</span><b>${fmt(h)} h · ${fmt(h*p.rate)} €</b></div>`}).join("")}</div></section>`}
function settingsView(){header("Nastavenia");app.innerHTML=`<section class="projectsPanel"><div class="panelHeading"><h2>Nastavenia a záloha údajov</h2></div><div class="backupBar"><div><b>Exportovať údaje</b><span>Stiahni si bezpečnostnú kópiu všetkých projektov.</span></div><button class="primary" onclick="backupData()">⇩ Uložiť zálohu</button></div><div class="backupBar"><div><b>Obnoviť údaje</b><span>Načítaj predtým uložený JSON súbor.</span></div><input type="file" accept=".json,application/json" onchange="restoreData(event)"></div><div class="backupBar"><div><b>Počet uložených projektov</b><span>${ps.length} projektov v tejto aplikácii</span></div></div></section>`}
function list(){
header("Pracovné hodiny");let totalH=0,totalE=0,totalAdvance=0;
ps.forEach(x=>{totalH+=x.days.reduce((a,d)=>a+ +d.hours,0);totalE+=x.days.reduce((a,d)=>a+ +d.hours,0)*x.rate;totalAdvance+=+x.advance||0});
const annual=annualFreeSummary(),currentYear=new Date().getFullYear(),current=annual.find(y=>String(y.year)===String(currentYear)),free=current?.free||365,worked=current?.worked||0,period=(new Date(currentYear+1,0,1)-new Date(currentYear,0,1))/86400000;
const annualHTML=annual.map(y=>`<div class="yearFreeRow"><span>${y.year}</span><b>${y.free} dní voľna</b></div>`).join("");
const ordered=ps.map((x,i)=>({x,i})).sort((a,b)=>D(a.x.start)-D(b.x.start));
app.innerHTML=`<div class="dashboard"><section class="welcomePanel"><div><div class="eyebrow">OSOBNÁ EVIDENCIA PRÁCE</div><h1>Prehľad pracovných projektov</h1><p>Všetky tvoje zákazky, odpracované hodiny a zárobky na jednom mieste.</p></div><button class="primary newProjectBtn" onclick="newP()">＋ Nový projekt</button></section>
<section class="metricGrid"><div class="metricCard"><span class="metricIcon">◷</span><span class="metricLabel">Odpracované hodiny</span><strong>${fmt(totalH)} <small>h</small></strong><span class="metricFoot">Spolu za všetky projekty</span></div><div class="metricCard"><span class="metricIcon">€</span><span class="metricLabel">Celkový zárobok</span><strong>${fmt(totalE)} <small>€</small></strong><span class="metricFoot">Pred odpočítaním záloh</span></div><div class="metricCard"><span class="metricIcon">✓</span><span class="metricLabel">Odpracované dni</span><strong>${worked}</strong><span class="metricFoot">Z roka ${currentYear}</span></div><div class="metricCard"><span class="metricIcon">⌂</span><span class="metricLabel">Voľné dni</span><strong>${free}</strong><span class="metricFoot">Z ${period} dní roka ${currentYear}</span></div></section>
<div class="workspace"><section class="projectsPanel"><div class="panelHeading"><div><div class="eyebrow">ZOZNAM ZÁKAZIEK</div><h2>Moje projekty</h2></div><span class="countPill">${ps.length} projektov</span></div><div id="p" class="projectGrid"></div><div class="backupBar"><div><b>Záloha údajov</b><span>Ulož si evidenciu alebo obnov predchádzajúcu zálohu.</span></div><div class="backupActions"><button class="light" onclick="backupData()">↓ Uložiť zálohu</button><button class="light" onclick="document.getElementById('restoreFile').click()">↑ Obnoviť zálohu</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)"></div></div></section>
<aside class="summaryPanel"><div class="panelHeading"><div><div class="eyebrow">FINANČNÝ PREHĽAD</div><h2>Celkový súhrn</h2></div></div><div class="detailMetric"><span>Celkový zárobok</span><b class="balanceValue">${fmt(totalE)} €</b></div><div class="detailMetric"><span>Celé obdobie</span><b>${period} dní</b></div><div class="yearlyFree"><h4>Voľno podľa rokov</h4>${annualHTML||'<p class="muted">Zatiaľ bez evidovaných dní.</p>'}</div></aside></div></div>`;
const p=document.querySelector("#p");if(!ps.length){p.innerHTML='<div class="emptyState"><div>▤</div><b>Zatiaľ tu nemáš žiadny projekt</b><span>Pridaj prvý projekt a začni evidovať odpracované hodiny.</span><button class="primary" onclick="newP()">＋ Pridať projekt</button></div>';return}
ordered.forEach(({x,i})=>{let h=x.days.reduce((a,d)=>a+ +d.hours,0);p.innerHTML+=`<article class="projectCard" style="--project-accent:${countryAccent(x.country||x.name)}" onclick="openP(${i})"><div class="projectCardTop"><span class="projectMark">${flagFor(x.country||x.name)}</span><span class="projectArrow">↗</span></div><h3>${esc(x.name)}</h3><div class="projectDates"><span><i>OD</i>${sd(x.start)}</span><span><i>DO</i>${sd(x.end)}</span></div><div class="projectCardBottom"><b>${fmt(h)} h</b><span>${fmt(h*x.rate)} €</span></div></article>`});
}
function header(t){document.querySelector("#appTitle").textContent=t;document.querySelectorAll(".navTab").forEach((b,i)=>b.classList.toggle("active",i===(t==="Kalendár"?1:t==="Štatistiky"?2:t==="Nastavenia"?4:0)))}
function backupData(){const data={version:1,app:"Pracovné hodiny",savedAt:new Date().toISOString(),projects:ps};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Pracovne_hodiny_zaloha.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreData(event){const file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.projects))throw new Error("bad");if(!confirm("Obnoviť uložené údaje? Aktuálne údaje sa nahradia zálohou."))return;ps=data.projects;save();list();alert("Údaje boli obnovené.")}catch(e){alert("Tento súbor nie je platná záloha aplikácie.")}event.target.value=""};reader.readAsText(file)}
const countryOptions=[["SE","🇸🇪","Švédsko"],["FI","🇫🇮","Fínsko"],["NO","🇳🇴","Nórsko"],["DK","🇩🇰","Dánsko"],["IS","🇮🇸","Island"],["NL","🇳🇱","Holandsko"],["BE","🇧🇪","Belgicko"],["DE","🇩🇪","Nemecko"],["AT","🇦🇹","Rakúsko"],["CH","🇨🇭","Švajčiarsko"],["FR","🇫🇷","Francúzsko"],["ES","🇪🇸","Španielsko"],["PT","🇵🇹","Portugalsko"],["IT","🇮🇹","Taliansko"],["PL","🇵🇱","Poľsko"],["SK","🇸🇰","Slovensko"],["CZ","🇨🇿","Česko"],["HU","🇭🇺","Maďarsko"],["GB","🇬🇧","Spojené kráľovstvo"],["IE","🇮🇪","Írsko"],["LU","🇱🇺","Luxembursko"],["HR","🇭🇷","Chorvátsko"],["SI","🇸🇮","Slovinsko"],["GR","🇬🇷","Grécko"],["RO","🇷🇴","Rumunsko"],["BG","🇧🇬","Bulharsko"],["EE","🇪🇪","Estónsko"],["LV","🇱🇻","Lotyšsko"],["LT","🇱🇹","Litva"],["US","🇺🇸","USA"],["CA","🇨🇦","Kanada"],["AE","🇦🇪","Spojené arabské emiráty"],["SA","🇸🇦","Saudská Arábia"],["QA","🇶🇦","Katar"],["KW","🇰🇼","Kuvajt"],["AU","🇦🇺","Austrália"]];
function countryAccent(value){const code=countryOptions.some(x=>x[0]===value)?value:null;const palette={SE:"#2879c7",FI:"#36a6c8",NO:"#d94b59",DK:"#c84b62",IS:"#397fbd",NL:"#e47b32",BE:"#d7a52d",DE:"#4c5968",AT:"#cf4545",CH:"#d94b4b",FR:"#426fc2",ES:"#e5a12d",PT:"#24966b",IT:"#26966b",PL:"#d94c55",SK:"#397ac3",CZ:"#3f79b8",HU:"#3b9a70",GB:"#5865b7",IE:"#32966b",LU:"#4e80c7",HR:"#d64e58",SI:"#3a91a2",GR:"#328fc5",RO:"#d3a02c",BG:"#4c9b70",EE:"#397ec0",LV:"#b84f5b",LT:"#4c966b",US:"#4b6fb4",CA:"#d64e58",AE:"#2e9a86",SA:"#27966c",QA:"#8a557c",KW:"#2b9a78",AU:"#4a70ba"};if(code)return palette[code]||"#2585b8";const flag=flagFor(value);const inferred={"🇸🇪":"#2879c7","🇫🇮":"#36a6c8","🇳🇴":"#d94b59","🇳🇱":"#e47b32","🇪🇸":"#e5a12d","🇩🇪":"#4c5968"};return inferred[flag]||"#2585b8"}
function countryFlag(code){return countryOptions.find(x=>x[0]===code)?.[1]||"🌍"}
function flagFor(value){if(countryOptions.some(x=>x[0]===value))return countryFlag(value);const s=(value||"").toLowerCase();if(/swe|sweden|švéd|kungälv/.test(s))return "🇸🇪";if(/finland|fíns|turku/.test(s))return "🇫🇮";if(/nor|nór|askim|oslo/.test(s))return "🇳🇴";if(/nether|holand|maastricht/.test(s))return "🇳🇱";if(/spain|špan|pamplona|málaga|malaga/.test(s))return "🇪🇸";if(/german|neme|braunschweig/.test(s))return "🇩🇪";return "🌍"}
function newP(){header("Nový projekt");app.innerHTML=`<section class="projectsPanel projectFormPanel"><div class="panelHeading"><div><div class="eyebrow">NOVÁ ZÁKAZKA</div><h2>Vytvoriť projekt</h2></div></div><div class="projectForm"><label for="n">Názov projektu</label><input id="n" placeholder="napr. Trampoline park – Holandsko"><label for="country">Štát projektu</label><select id="country" class="countrySelect"><option value="">Vyber štát</option>${countryOptions.map(x=>`<option value="${x[0]}">${x[1]} ${x[2]}</option>`).join("")}</select><div class="row"><div><label for="s">Začiatok</label><input id="s" type="date"></div><div><label for="e">Koniec</label><input id="e" type="date"></div></div><div class="row"><div><label for="r">Sadzba €/h</label><input id="r" type="number" value="15" step=".01"></div><div><label for="a">Záloha €</label><input id="a" type="number" value="0" step=".01"></div></div><div class="actions"><button class="light" onclick="list()">Zrušiť</button><button class="primary" onclick="create()">⚡ Vygenerovať dni</button></div></div></section>`}
function create(){let n=document.getElementById("n").value.trim(),country=document.getElementById("country").value,s=document.getElementById("s").value,e=document.getElementById("e").value;if(!n||!country||!s||!e||D(e)<D(s)){alert("Vyplň názov, štát a správne dátumy projektu.");return}ps.push({name:n,country,start:s,end:e,rate:+document.getElementById("r").value||0,advance:+document.getElementById("a").value||0,days:days(s,e)});save();openP(ps.length-1)}
function openP(i){cur=i;render()}
function render(){
let x=ps[cur],h=x.days.reduce((a,d)=>a+ +d.hours,0),workedDays=x.days.filter(d=>+d.hours>0).length,freeDays=x.days.filter(d=>+d.hours===0).length,total=x.days.length,earn=h*x.rate;header(x.name);
app.innerHTML=`<div class="projectPage"><div class="projectPageTop"><button class="backLink" onclick="list()">← Všetky projekty</button><span class="eyebrow">DETAIL PROJEKTU</span><h1>${esc(x.name)}</h1><div class="heroDates"><span class="startTag">Začiatok · ${sd(x.start)}</span><span class="endTag">Koniec · ${sd(x.end)}</span></div></div>
<section class="projectMetrics"><div class="projectMetric"><span>Odpracované hodiny</span><b>${fmt(h)} <small>h</small></b></div><div class="projectMetric"><span>Zárobok</span><b>${fmt(earn)} <small>€</small></b></div><div class="projectMetric"><span>Odpracované dni</span><b>${workedDays}</b></div><div class="projectMetric"><span>Voľno v projekte</span><b>${freeDays}</b></div></section>
<div class="projectWorkspace"><section class="workLogPanel"><div class="panelHeading"><div><div class="eyebrow">DENNÁ EVIDENCIA</div><h2>Pracovné dni</h2></div><span class="countPill">${total} dní</span></div><div class="tableWrap"><table class="table"><thead><tr><th>Deň</th><th>Dátum</th><th>Odpracované hodiny</th></tr></thead><tbody>${x.days.map((d,j)=>{let free=+d.hours===0;return `<tr class="${dayClass(d.date)} ${d.date===x.start?"project-start":""} ${d.date===x.end?"project-end":""} ${free?"freeDay":""}"><td><b>${dn(d.date)}</b></td><td><span class="dateBadge">${sd(d.date)}</span></td><td><input class="hour" type="number" min="0" step=".25" value="${d.hours||""}" placeholder="0" onchange="ps[cur].days[${j}].hours=+this.value||0;save();render()"></td></tr>`}).join("")}</tbody></table></div></section>
<aside class="projectInfoPanel"><div class="eyebrow">NASTAVENIA ZÁKAZKY</div><h2>Informácie o projekte</h2><div class="infoBlock"><span>Dátum začiatku</span><b class="infoStart">${sd(x.start)}</b></div><div class="infoBlock"><span>Dátum ukončenia</span><b class="infoEnd">${sd(x.end)}</b></div><div class="infoBlock"><span>Hodinová sadzba</span><b>${fmt(x.rate)} € / h</b></div><div class="infoBlock"><span>Vyplatená záloha</span><b>${fmt(x.advance)} €</b></div><div class="infoBlock"><span>Zostáva vyplatiť</span><b class="balanceValue">${fmt(earn-x.advance)} €</b></div><div class="settingsActions"><button class="light" onclick="editName()">✎ Upraviť názov</button><button class="light" onclick="editCountry()">🌍 Upraviť štát</button><button class="light" onclick="editDates()">▦ Upraviť dátumy</button><button class="light" onclick="edit()">€ Upraviť sadzbu a zálohu</button></div></aside></div></div>`;
}
function editCountry(){let x=ps[cur];header("Upraviť štát");app.innerHTML=`<section class="projectsPanel projectFormPanel"><div class="panelHeading"><div><div class="eyebrow">ÚPRAVA ZÁKAZKY</div><h2>Štát projektu</h2></div></div><div class="projectForm"><label for="projectCountry">Vyber štát</label><select id="projectCountry" class="countrySelect"><option value="">Vyber štát</option>${countryOptions.map(v=>`<option value="${v[0]}" ${(x.country||"")===v[0]?"selected":""}>${v[1]} ${v[2]}</option>`).join("")}</select><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveCountry()">Uložiť štát</button></div></div></section>`}
function saveCountry(){let country=document.getElementById("projectCountry").value;if(!country){alert("Vyber štát projektu.");return}ps[cur].country=country;save();render()}
function editName(){let x=ps[cur];header("Upraviť názov");app.innerHTML=`<div class="card"><h2>Názov projektu</h2><label>Názov</label><input id="pn" type="text" value="${esc(x.name)}"><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveName()">Uložiť</button></div></div>`;document.getElementById("pn").focus()}
function saveName(){let n=document.getElementById("pn").value.trim();if(!n){alert("Názov projektu nemôže byť prázdny.");return}ps[cur].name=n;save();render()}
function editDates(){let x=ps[cur];header("Upraviť dátumy");app.innerHTML=`<div class="card"><h2>${esc(x.name)}</h2><label>Dátum začiatku projektu</label><input id="ds" type="date" value="${x.start}"><label>Dátum konca projektu</label><input id="de" type="date" value="${x.end}"><p class="muted">Po uložení sa zoznam dní automaticky prispôsobí novému rozsahu. Už zadané hodiny pre existujúce dátumy zostanú zachované.</p><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveDates()">Uložiť</button></div></div>`}
function saveDates(){let ns=document.getElementById("ds").value,ne=document.getElementById("de").value;if(!ns||!ne||D(ne)<D(ns)){alert("Dátumy nie sú správne.");return}let x=ps[cur],old=Object.fromEntries(x.days.map(d=>[d.date,d.hours]));x.start=ns;x.end=ne;x.days=days(ns,ne).map(d=>({date:d.date,hours:old[d.date]||0}));save();render()}
function edit(){let x=ps[cur];header("Upraviť");app.innerHTML=`<section class="projectsPanel projectFormPanel"><div class="panelHeading"><div><div class="eyebrow">ÚPRAVA ZÁKAZKY</div><h2>${esc(x.name)}</h2></div></div><div class="projectForm"><label for="editCountry">Štát projektu</label><select id="editCountry" class="countrySelect"><option value="">Vyber štát</option>${countryOptions.map(v=>`<option value="${v[0]}" ${(x.country||"")===v[0]?"selected":""}>${v[1]} ${v[2]}</option>`).join("")}</select><label for="er">Sadzba €/h – platí pre VŠETKY hodiny projektu</label><input id="er" type="number" step=".01" value="${x.rate}"><label for="ea">Záloha €</label><input id="ea" type="number" step=".01" value="${x.advance}"><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveEdit()">Uložiť zmeny</button></div></div></section>`}
function saveEdit(){ps[cur].country=document.getElementById("editCountry").value;ps[cur].rate=+document.getElementById("er").value||0;ps[cur].advance=+document.getElementById("ea").value||0;save();render()}
const app=document.getElementById("app");list();
</script></body></html>
