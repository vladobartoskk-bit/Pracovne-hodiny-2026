<script>
const K="ph_demo";let ps=JSON.parse(localStorage.getItem(K)||"[]"),cur=-1;
const fmt=n=>Number(n||0).toLocaleString("sk-SK",{minimumFractionDigits:2,maximumFractionDigits:2});
const D=s=>{let[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)},iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`};
const sd=s=>D(s).toLocaleDateString("sk-SK"),dn=s=>["Ne","Po","Ut","St","Št","Pi","So"][D(s).getDay()];
const dayClass=s=>D(s).getDay()===0?"sun":"";
function save(){localStorage.setItem(K,JSON.stringify(ps))}
const TK=K+"_travel";
let travelTrips=JSON.parse(localStorage.getItem(TK)||"[]");
function saveTravel(){localStorage.setItem(TK,JSON.stringify(travelTrips))}
function travelHours(t){return Math.max(0,(new Date(t.end)-new Date(t.start))/3600000)}
function travelTotals(){const hours=travelTrips.reduce((n,t)=>n+travelHours(t),0);return {hours,days:hours/24}}
function travelDateSet(year){const out=new Set();travelTrips.forEach(t=>{if(!t.start||!t.end)return;let d=new Date(t.start),e=new Date(t.end);d=new Date(d.getFullYear(),d.getMonth(),d.getDate());e=new Date(e.getFullYear(),e.getMonth(),e.getDate());while(d<=e){const key=iso(d);if(key.startsWith(String(year)))out.add(key);d.setDate(d.getDate()+1)}});return out}
function yearDayStats(year){const a=new Date(+year,0,1),z=new Date(+year+1,0,1),project=new Set(),worked=new Set();ps.forEach(p=>p.days.forEach(d=>{if(d.date.startsWith(String(year))){project.add(d.date);if(+d.hours>0)worked.add(d.date)}}));const travel=travelDateSet(year);let home=0,projectFree=0;for(let d=new Date(a);d<z;d.setDate(d.getDate()+1)){const k=iso(d);if(travel.has(k)||worked.has(k))continue;if(project.has(k))projectFree++;else home++}return {worked:worked.size,projectFree,home,travel:travel.size,total:(z-a)/86400000}}
let travelDraftCount=1;
function travelSegmentRow(i,s={}){return `<div class="travelSegment" data-segment="${i}"><b>Úsek ${i+1}</b><label>Doprava<select id="travelMode${i}"><option value="car" ${s.mode==="car"?"selected":""}>🚗 Auto</option><option value="plane" ${s.mode==="plane"?"selected":""}>✈️ Lietadlo</option><option value="bus" ${s.mode==="bus"?"selected":""}>🚌 Autobus</option><option value="train" ${s.mode==="train"?"selected":""}>🚆 Vlak</option><option value="taxi" ${s.mode==="taxi"?"selected":""}>🚕 Taxi</option><option value="ship" ${s.mode==="ship"?"selected":""}>🚢 Loď</option><option value="other" ${s.mode==="other"?"selected":""}>Iné</option></select></label><label>Odkiaľ <input id="travelFrom${i}" value="${esc(s.from||"")}" placeholder="Napr. domov / letisko"></label><label>Kam <input id="travelTo${i}" value="${esc(s.to||"")}" placeholder="Napr. letisko / hotel"></label><label>Odchod <input id="travelSegStart${i}" type="datetime-local" value="${s.start||""}"></label><label>Príchod <input id="travelSegEnd${i}" type="datetime-local" value="${s.end||""}"></label></div>`}
function renderProjectTravelCards(){const host=document.getElementById("projectTravelCards");if(!host)return;const trips=travelTrips.filter(t=>t.projectIndex===cur||(!Number.isInteger(t.projectIndex)&&t.projectName===ps[cur].name));host.innerHTML=trips.map(t=>{const segs=t.segments||[{mode:"other",from:"Cesta",to:"",start:t.start,end:t.end}];return '<article class="tripCard"><div class="tripHead"><b>'+esc(t.projectName||ps[cur].name)+'</b><span class="tripPill">'+new Date(t.start).toLocaleDateString("sk-SK")+' – '+new Date(t.end).toLocaleDateString("sk-SK")+'</span><span class="tripPill">'+travelHours(t).toFixed(2)+' h</span><span class="tripPill purple">'+(travelHours(t)/24).toFixed(2)+' dni</span><button class="tripDelete" onclick="removeTravel('+t.id+');render()">×</button></div><div class="tripTimeline">'+segs.map(g=>'<div class="tripLeg"><span class="legIcon '+g.mode+'">'+({car:"🚗",plane:"✈️",bus:"🚌",train:"🚆",taxi:"🚕",ship:"🚢",other:"↗"}[g.mode]||"↗")+'</span><b class="legRoute">'+esc(g.from||"—")+' → '+esc(g.to||"—")+'</b><span class="legTime">'+new Date(g.start).toLocaleString("sk-SK")+'</span><span class="legTime">'+new Date(g.end).toLocaleString("sk-SK")+'</span><b class="legDuration">'+travelHours(g).toFixed(2)+' h</b></div>').join("")+'</div><div class="tripTotal">◷ Celkové trvanie cesty: <b>'+travelHours(t).toFixed(2)+' h</b> | Prepočet na dni: <b>'+(travelHours(t)/24).toFixed(2)+' dni</b></div></article>'}).join("")||'<div class="emptyTrips">K tomuto projektu zatiaľ nie je priradená žiadna cesta.</div>'}
function renderTravelCards(){const host=document.getElementById("travelCards");if(!host)return;const labels={car:"🚗 Auto",plane:"✈️ Lietadlo",bus:"🚌 Autobus",train:"🚆 Vlak",taxi:"🚕 Taxi",ship:"🚢 Loď",other:"Iné"};host.innerHTML=travelTrips.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(t=>{const segs=t.segments||[{mode:"other",from:"Cesta",to:"",start:t.start,end:t.end}];return '<article class="tripCard"><div class="tripHead"><span class="tripPlane">✈</span><b>'+segs.map(s=>esc(s.from||"")).filter(Boolean)[0]+' – '+esc(segs[segs.length-1].to||"Cesta")+'</b><span class="tripPill">'+new Date(t.start).toLocaleDateString("sk-SK")+' – '+new Date(t.end).toLocaleDateString("sk-SK")+'</span><span class="tripPill">'+travelHours(t).toFixed(2)+' h</span><span class="tripPill purple">'+(travelHours(t)/24).toFixed(2)+' dni</span><button class="tripDelete" onclick="removeTravel('+t.id+');list()">×</button></div><div class="tripTimeline">'+segs.map(g=>'<div class="tripLeg"><span class="legIcon '+g.mode+'">'+(labels[g.mode]||"↗")+'</span><b class="legRoute">'+esc(g.from||"—")+' → '+esc(g.to||"—")+'</b><span class="legTime">'+new Date(g.start).toLocaleString("sk-SK")+'</span><span class="legTime">'+new Date(g.end).toLocaleString("sk-SK")+'</span><b class="legDuration">'+travelHours(g).toFixed(2)+' h</b></div>').join("")+'</div><div class="tripTotal">◷ &nbsp; Celkové trvanie cesty: <b>'+travelHours(t).toFixed(2)+' h</b> &nbsp; | &nbsp; Prepočet na dni: <b>'+(travelHours(t)/24).toFixed(2)+' dni</b></div></article>'}).join("")||'<div class="emptyTrips">Zatiaľ bez ciest. Pridaj prvú cestu.</div>'}
let activeTravelProject=null;
function openTravelEditor(projectIndex=null){activeTravelProject=Number.isInteger(projectIndex)?projectIndex:null;const host=document.getElementById(activeTravelProject!==null?"projectTravelEditor":"travelEditor");if(!host)return;travelDraftCount=1;const opts=ps.map((p,i)=>`<option value="${i}" ${activeTravelProject===i?"selected":""}>${esc(p.name)}</option>`).join("");host.innerHTML='<div class="travelEditor"><h3>Nová cesta</h3><label class="travelProjectPick">Priradiť k projektu <select id="travelProjectSelect"><option value="">Bez priradenia</option>'+opts+'</select></label><div id="travelSegments">'+travelSegmentRow(0)+'</div><div class="travelEditorActions"><button class="light" onclick="addTravelSegment()">＋ Pridať úsek</button><button class="primary" onclick="addTravel()">Uložiť cestu</button><button class="light" onclick="document.getElementById(\''+(activeTravelProject!==null?"projectTravelEditor":"travelEditor")+'\').innerHTML=\'\'">Zrušiť</button></div></div>'}
function addTravelSegment(){const rows=document.querySelectorAll(".travelSegment");travelDraftCount=rows.length+1;const host=document.getElementById("travelSegments");host.insertAdjacentHTML("beforeend",travelSegmentRow(travelDraftCount-1));}
function addTravel(){const segments=[...document.querySelectorAll(".travelSegment")].map((el,i)=>({mode:document.getElementById("travelMode"+i).value,from:document.getElementById("travelFrom"+i).value.trim(),to:document.getElementById("travelTo"+i).value.trim(),start:document.getElementById("travelSegStart"+i).value,end:document.getElementById("travelSegEnd"+i).value}));if(!segments.length||segments.some(s=>!s.start||!s.end||new Date(s.end)<new Date(s.start))){alert("Vyplň dátum a čas odchodu aj príchodu pri každom úseku.");return}segments.sort((a,b)=>new Date(a.start)-new Date(b.start));const start=segments[0].start,end=segments[segments.length-1].end;if(segments.some((s,i)=>i&&new Date(s.start)<new Date(segments[i-1].end))){alert("Časy jednotlivých úsekov sa prekrývajú. Skontroluj ich, prosím.");return}const selectedProject=document.getElementById("travelProjectSelect")?.value??"";const projectIndex=selectedProject===""?null:Number(selectedProject);travelTrips.push({id:Date.now(),start,end,segments,projectIndex,projectName:projectIndex!==null?ps[projectIndex].name:null});saveTravel();travelDraftCount=1;if(projectIndex!==null){activeTravelProject=null;cur=projectIndex;render()}else{activeTravelProject=null;list()}}

function removeTravel(id){travelTrips=travelTrips.filter(t=>t.id!==id);saveTravel();settingsView()}
function days(a,b){let r=[],d=D(a),e=D(b);while(d<=e){r.push({date:iso(d),hours:0});d.setDate(d.getDate()+1)}return r}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function annualFreeSummary(){const years=new Set([String(new Date().getFullYear()),...ps.flatMap(p=>p.days.map(d=>d.date.slice(0,4))),...travelTrips.map(t=>t.start.slice(0,4))]);return [...years].sort().map(year=>{const s=yearDayStats(year);return {...s,year,free:s.home+s.projectFree}})}

function flagFor(name){const s=(name||"").toLowerCase();if(/swe|sweden|švéd|halmstad|kungälv|kungens/.test(s))return "🇸🇪";if(/fi|finland|turku/.test(s))return "🇫🇮";if(/es|spain|špan|pamplona|málaga|malaga/.test(s))return "🇪🇸";if(/nor|nór|askim|oslo/.test(s))return "🇳🇴";if(/nl|nether|holand|maastricht|waalwijk|arnhem/.test(s))return "🇳🇱";if(/de|german|braunschweig/.test(s))return "🇩🇪";if(/dubai|uae|emir/.test(s))return "🇦🇪";return "🌍"}
let calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function shiftCalendar(delta){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+delta,1);calendarView()}
function calendarProjectColor(i){const colors=["#dbeafe","#fce7f3","#ffedd5","#e9d5ff","#ccfbf1","#fef3c7","#e0e7ff","#fee2e2","#d1fae5","#f3e8ff","#cffafe","#fce7f3"];return colors[i%colors.length]}

function statsView(){header("Štatistiky");let hours=0,earn=0,worked=0;ps.forEach(p=>p.days.forEach(d=>{let h=+d.hours||0;hours+=h;earn+=h*p.rate;if(h>0)worked++}));const colors=["#1685ed","#8b5cf6","#f59e0b","#10b981","#ec4899","#06b6d4","#eab308","#64748b","#f43f5e","#84cc16","#a855f7","#14b8a6"];const sorted=ps.map((p,i)=>({p,i,h:p.days.reduce((s,d)=>s+(+d.hours||0),0)})).sort((a,b)=>b.h-a.h);const rows=sorted.map(x=>{const share=hours?x.h/hours*100:0,col=colors[x.i%colors.length];return '<tr><td><span class="statsProjectName"><i style="--project-color:'+col+'"></i><b>'+esc(x.p.name)+'</b></span></td><td><strong>'+fmt(x.h)+' h</strong><div class="statsBar"><span style="width:'+share+'%;--project-color:'+col+'"></span></div></td><td class="statsMoney">'+fmt(x.h*x.p.rate)+' €</td><td><span class="statsShare">'+share.toFixed(1).replace(".",",")+' %</span></td></tr>'}).join("");let pos=0;const donutStops=sorted.filter(x=>x.h>0).map(x=>{const start=pos;pos+=x.h/hours*100;return colors[x.i%colors.length]+" "+start.toFixed(2)+"% "+pos.toFixed(2)+"%"}).join(",");const donutStyle=hours?"conic-gradient("+donutStops+")":"#e8eef6";const legend=sorted.slice(0,7).map(x=>'<div><i style="background:'+colors[x.i%colors.length]+'"></i><span>'+esc(x.p.name)+'</span><b>'+(hours?(x.h/hours*100).toFixed(1).replace(".",","):"0,0")+' %</b></div>').join("");app.innerHTML='<section class="statsPage"><div class="statsIntro"><div><div class="statsEyebrow">PREHĽAD A VÝKON</div><h2>Štatistiky práce</h2><p>Prehľad odpracovaného času, zárobkov a jednotlivých projektov</p></div><div class="statsYear"><span>Rozsah evidencie</span><b>Všetky projekty</b></div></div><div class="statsKpis"><article class="statsKpi blue"><small>Hodiny spolu</small><strong>'+fmt(hours)+' <i>h</i></strong><em>Celkový odpracovaný čas</em></article><article class="statsKpi green"><small>Zárobok spolu</small><strong>'+fmt(earn)+' <i>€</i></strong><em>Súčet podľa sadzieb projektov</em></article><article class="statsKpi orang function backupData(){const data={version:3,app:"Pracovné hodiny",savedAt:new Date().toISOString(),projects:ps,travelTrips,invoices};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Pracovne_hodiny_zaloha.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreData(event){const file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.projects))throw new Error("bad");if(!confirm("Obnoviť uložené údaje? Aktuálne údaje sa nahradia zálohou."))return;ps=data.projects;travelTrips=Array.isArray(data.travelTrips)?data.travelTrips:[];invoices=Array.isArray(data.invoices)?data.invoices:[];save();saveTravel();saveInvoices();list();alert("Údaje boli obnovené.")}catch(e){alert("Tento súbor nie je platná záloha aplikácie.")}event.target.value=""};reader.readAsText(file)}

function nextInvoiceNumber(){const year=String(new Date().getFullYear()),prefix="30"+year.slice(-2),nums=invoices.map(v=>String(v.number||"")).filter(v=>v.startsWith(prefix)).map(v=>parseInt(v.slice(prefix.length),10)||0);const last=Math.max(5,...nums);return prefix+String(last+1).padStart(4,"0")}

/section>';["serviceQuantity","servicePrice","serviceAdvance"].forEach(id=>document.getElementById(id).addEventListener("input",calcServiceInvoice))}
function calcServiceInvoice(){const q=Math.max(0,+document.getElementById("serviceQuantity").value||0),p=Math.max(0,+document.getElementById("servicePrice").value||0),a=Math.max(0,+document.getElementById("serviceAdvance").value||0),sum=q*p;document.getElementById("serviceTotal").textContent=fmt(sum)+" €";document.getElementById("serviceDue").textContent=fmt(Math.max(0,sum-a))+" €"}
function saveServiceInvoice(){const q=Math.max(0,+document.getElementById("serviceQuantity").value||0),price=Math.max(0,+document.getElementById("servicePrice").value||0),subtotal=q*price,advance=Math.max(0,+document.getElementById("serviceAdvance").value||0),customer=document.getElementById("invCustomer").value.trim();if(!customer||!q||!price||subtotal<=0){alert("Vyplň odberateľa, množstvo a cenu servisných prác.");return}if(advance>subtotal){alert("Záloha nemôže byť vyššia ako fakturovaná suma.");return}const invoice={id:"inv_"+Date.now(),number:document.getElementById("invNumber").value.trim(),projectId:"service",projectName:"Servisné práce",billedHours:0,internal:{},customer,address:document.getElementById("invAddress").value.trim(),ico:document.getElementById("invIco").value,dic:document.getElementById("invDic").value,order:document.getElementById("invOrder").value,issueDate:document.getElementById("invIssue").value,supplyDate:document.getElementById("invSupply").value,dueDate:document.getElementById("invDue").value,payment:document.getElementById("invPayment").value,lines:[{description:document.getElementById("serviceDescription").value.trim()||"Servisné práce",quantity:q,unit:"ks",unitPrice:price,total:subtotal}],subtotal,advance,totalDue:Math.max(0,subtotal-advance),status:"Vystavená",createdAt:new Date().toISOString()};if(!invoice.number){alert("Vyplň číslo faktúry.");return}if(invoices.some(v=>v.number===invoice.number)){alert("Toto číslo faktúry už existuje.");return}localStorage.setItem("ph_service_customer",JSON.stringify({customer:invoice.customer,address:invoice.address,ico:invoice.ico,dic:invoice.dic}));invoices.push(invoice);saveInvoices();showInvoice(invoice.id)}

function loadInvoiceDraft(){const i=+document.getElementById("invProject").value;if(!Number.isInteger(i)||!ps[i])return;const p=ps[i],hours=invoiceProjectHours({...p,_id:String(i)});const existing=invoices.filter(v=>v.projectId===String(i)).reduce((n,v)=>n+(+v.advance||0),0);const advance=Math.max(0,(+p.advance||0)-existing);const customer=p.invoiceCustomer||"",address=p.invoiceAddress||"",ico=p.invoiceIco||"",dic=p.invoiceDic||"",order=p.orderNumber||"";window.invoiceDraftProject=i;window.invoiceDraftHours=hours;document.getElementById("invoiceDraft").innerHTML='<div class="invoiceGrid" style="margin-top:16px"><label>Odberateľ<input id="invCustomer" value="'+esc(customer)+'" placeholder="Názov firmy"></label><label>Adresa odberateľa<input id="invAddress" value="'+esc(address)+'" placeholder="Ulica, PSČ, mesto"></label><label>IČO<input id="invIco" value="'+esc(ico)+'"></label><label>DIČ / IČ DPH<input id="invDic" value="'+esc(dic)+'"></label><label>Číslo objednávky<input id="invOrder" value="'+esc(order)+'"></label><label>Dátum vystavenia<input id="invIssue" type="date" value="'+iso(new Date())+'"></label><label>Dátum dodania<input id="invSupply" type="date" value="'+iso(new Date())+'"></label><label>Dátum splatnosti<input id="invDue" type="date" value="'+iso(new Date(Date.now()+14*86400000))+'"></label></div><section class="invoicePanel" style="padding:16px;margin-top:18px;background:#f7faff"><h3>Interné výpočty – hárok DATA</h3><p class="muted">Pracovné hodiny sa zobrazia ako Montáž projektu. DRIVE, WAITING, TRANSFER a TRAVELING sa sčítajú iba do položky Iné.</p><div class="invoiceGrid"><label>Pracovné hodiny<input id="dataHours" type="number" min="0" step=".25" value="'+hours+'"></label><label>Sadzba €/h<input id="dataRate" type="number" min="0" step=".01" value="'+(+p.rate||0)+'"></label><label>DRIVE – hodiny<input id="dataDrive" type="number" min="0" step=".25" value="0"></label><label>DRIVE – €/h<input id="dataDriveRate" type="number" min="0" step=".01" value= function countryAccent(value){const code=countryOptions.some(x=>x[0]===value)?value:null;const palette={SE:"#2879c7",FI:"#36a6c8",NO:"#d94b59",DK:"#c84b62",IS:"#397fbd",NL:"#e47b32",BE:"#d7a52d",DE:"#4c5968",AT:"#cf4545",CH:"#d94b4b",FR:"#426fc2",ES:"#e5a12d",PT:"#24966b",IT:"#26966b",PL:"#d94c55",SK:"#397ac3",CZ:"#3f79b8",HU:"#3b9a70",GB:"#5865b7",IE:"#32966b",LU:"#4e80c7",HR:"#d64e58",SI:"#3a91a2",GR:"#328fc5",RO:"#d3a02c",BG:"#4c9b70",EE:"#397ec0",LV:"#b84f5b",LT:"#4c966b",US:"#4b6fb4",CA:"#d64e58",AE:"#2e9a86",SA:"#27966c",QA:"#8a557c",KW:"#2b9a78",AU:"#4a70ba"};if(code)return palette[code]||"#2585b8";const flag=flagFor(value);const inferred={"🇸🇪":"#2879c7","🇫🇮":"#36a6c8","🇳🇴":"#d94b59","🇳🇱":"#e47b32","🇪🇸":"#e5a12d","🇩🇪":"#4c5968"};return inferred[flag]||"#2585b8"}
function countryFlag(code){return countryOptions.find(x=>x[0]===code)?.[1]||"🌍"}
function flagFor(value){if(countryOptions.some(x=>x[0]===value))return countryFlag(value);const s=(value||"").toLowerCase();if(/swe|sweden|švéd|kungälv/.test(s))return "🇸🇪";if(/finland|fíns|turku/.test(s))return "🇫🇮";if(/nor|nór|askim|oslo/.test(s))return "🇳🇴";if(/nether|holand|maastricht/.test(s))return "🇳🇱";if(/spain|špan|pamplona|málaga|malaga/.test(s))return "🇪🇸";if(/german|neme|braunschweig/.test(s))return "🇩🇪";return "🌍"}

<section class="projectMetrics"><div class="projectMetric"><span>Odpracované hodiny</span><b>${fmt(h)} <small>h</small></b></div><div class="projectMetric"><span>Zárobok</span><b>${fmt(earn)} <small>€</small></b></div><div class="projectMetric"><span>Odpracované dni</span><b>${workedDays}</b></div><div class="projectMetric"><span>Voľno v projekte</span><b>${freeDays}</b></div></section>
<section class="projectTravelPanel"><div class="projectTravelHead"><div><div class="eyebrow">CESTOVANIE K PROJEKTU</div><h2>Cesty na tento projekt</h2></div><button class="primary" onclick="openTravelEditor(cur)">＋ Pridať cestovanie</button></div><div id="projectTravelEditor"></div><div id="projectTravelCards"></div></section><div class="projectWorkspace"><section class="workLogPanel"><div class="panelHeading"><div><div class="eyebrow">DENNÁ EVIDENCIA</div><h2>Pracovné dni</h2></div><span class="countPill">${total} dní</span></div><div class="tableWrap"><table class="table"><thead><tr><th>Deň</th><th>Dátum</th><th>Odpracované hodiny</th></tr></thead><tbody>${x.days.map((d,j)=>{let free=+d.hours===0;return `<tr class="${dayClass(d.date)} ${d.date===x.start?"project-start":""} ${d.date===x.end?"project-end":""} ${free?"freeDay":""}"><td><b>${dn(d.date)}</b></td><td><span class="dateBadge">${sd(d.date)}</span></td><td><input class="hour" type="number" min="0" step=".25" value="${d.hours||""}" placeholder="0" onchange="ps[cur].days[${j}].hours=+this.value||0;save();render()"></td></tr>`}).join("")}</tbody></table></div></section>
<aside class="projectInfoPanel"><div class="eyebrow">NASTAVENIA ZÁKAZKY</div><h2>Informácie o projekte</h2><div class="infoBlock"><span>Číslo objednávky</span><b>${esc(x.orderNumber||"—")}</b></div><div class="infoBlock"><span>Dátum začiatku</span><b class="infoStart">${sd(x.start)}</b></div><div class="infoBlock"><span>Dátum ukončenia</span><b class="infoEnd">${sd(x.end)}</b></div><div class="infoBlock"><span>Hodinová sadzba</span><b>${fmt(x.rate)} € / h</b></div><div class="infoBlock"><span>Vyplatená záloha</span><b>${fmt(x.advance)} €</b></div><div class="infoBlock"><span>Zostáva vyplatiť</span><b class="balanceValue">${fmt(earn-x.advance)} €</b></div><div class="settingsActions"><button class="primary" onclick="newProjectAdvance(cur)">＋ Vytvoriť zálohovú faktúru</button><button class="primary" onclick="newProjectFinal(cur)">＋ Vytvoriť konečnú faktúru</button><button class="light" onclick="editName()">✎ Upraviť názov</button><button class="light" onclick="editOrderNumber()">№ Upraviť číslo objednávky</button><button class="light" onclick="editCountry()">🌍 Upraviť štát</button><button class="light" onclick="editDates()">▦ Upraviť dátumy</button><button class="light" onclick="edit()">€ Upraviť sadzbu</button></div></aside></div></div>`;
renderProjectTravelCards();
}

function newProjectAdvance(i){const p=ps[i];if(!p)return;const prior=invoices.filter(v=>v.projectId===String(i)&&v.invoiceType==="advance").reduce((s,v)=>s+(+v.subtotal||0),0);header("Zálohová faktúra");app.innerHTML='<div class="invoicePage"><section class="invoicePanel"><h2>Zálohová faktúra – '+esc(p.name)+'</h2><div class="invoiceGrid"><label>Číslo faktúry<input id="advNumber" value="'+nextInvoiceNumber()+'"></label><label>Odberateľ – vyber firmu<select id="advRecipient" onchange="fillAdvanceRecipient()"><option value="spi">SPI GLOBAL PLAY s.r.o.</option><option value="sl">SL-Elektromobile s.r.o.</option></select></label><label>Názov odberateľa<input id="advCustomer" value="SPI GLOBAL PLAY s.r.o."></label><label>Adresa<input id="advAddress" value="'+esc(p.invoiceAddress||"")+'"></label><label>IČO<input id="advIco" value="'+esc(p.invoiceIco||"")+'"></label><label>DIČ / IČ DPH<input id="advDic" value="'+esc(p.invoiceDic||"")+'"></label><label>Číslo objednávky<input id="advOrder" value="'+esc(p.orderNumber||"")+'"></label><label>Dátum vystavenia<input id="advIssue" type="date" value="'+iso(new Date())+'"></label><label>Dátum dodania<input id="advSupply" type="date" value="'+iso(new Date())+'"></label><label>Dátum splatnosti<input id="advDue" type="date" value="'+iso(new Date(Date.now()+14*86400000))+'"></label><label>Výška zálohy (€)<input id="advAmount" type="number" min="0.01" step=".01"></label></div><p class="muted">Predchádzajúce zálohové faktúry: '+fmt(prior)+' €</p><div class="invoiceActions"><button class="light" onclick="render()">Späť na projekt</button><button class="primary" onclick="saveProjectAdvance('+i+')">Vytvoriť zálohovú faktúru</button></div></section></div>'}
function fillAdvanceRecipient(){const type=document.getElementById("advRecipient").value;const data=type==="spi"?{customer:"SPI GLOBAL PLAY s.r.o.",address:"Sabinovská 2233, 082 21 Veľký Šariš",ico:"50930851",dic:"2120529235 / SK2120529235"}:{customer:"SL-Elektromobile s.r.o.",address:"Mýtna 1269/66, 064 01 Stará Ľubovňa",ico:"50774832",dic:"2120463147 / SK2120463147"};document.getElementById("advCustomer").value=data.customer;document.getElementById("advAddress").value=data.address;document.getElementById("advIco").value=data.ico;document.getElementById("advDic").value=data.dic}
function saveProjectAdvance(i){const p=ps[i],amount=Math.max(0,+document.getElementById("advAmount").value||0),number=document.getElementById("advNumber").value.trim(),customer=document.getElementById("advCustomer").value.trim();if(!amount||!number||!customer){alert("Vyplň číslo faktúry, odberateľa a sumu zálohy.");return}if(invoices.some(v=>v.number===number)){alert("Toto číslo faktúry už existuje.");return}const v={id:"inv_"+Date.now(),invoiceType:"advance",recipientType:document.getElementById("advRecipient").value,number,projectId:String(i),projectName:p.name,billedHours:0,internal:{},customer,address:document.getElementById("advAddress").value,ico:document.getElementById("advIco").value,dic:document.getElementById("advDic").value,order:document.getElementById("advOrder").value,issueDate:document.getElementById("advIssue").value,supplyDate:document.getElementById("advSupply").value,dueDate:document.getElementById("advDue").value,payment:"Bankový prevod",lines:[{description:"Záloha na projekt: "+p.name,quantity:1,unit:"ks",unitPrice:amount,total:amount}],subtotal:amount,advance:0,totalDue:amount,status:"Vystavená",createdAt:new Date().toISOString()};p.invoiceCustomer=v.customer;p.invoiceAddress=v.address;p.invoiceIco=v.ico;p.invoiceDic=v.dic;p.orderNumber=v.order;p.advance=(+p.advance||0)+amount;invoices.push(v);save();saveInvoices();showInvoice(v.id)}
function newProjectFinal(i){newInvoice();document.getElementById("invProject").value=String(i);loadInvoiceDraft();const prior=invoices.filter(v=>v.projectId===String(i)&&v.invoiceType==="advance").reduce((n,v)=>n+(+v.subtotal||0),0);const a=document.getElementById("invAdvance");if(a){a.value=prior;calcInvoice()}window.invoiceDraftType="final";const h=document.querySelector("#invoiceDraft h3");if(h)h.insertAdjacentHTML("beforebegin",'<p class="muted"><b>Konečná faktúra.</b> Automaticky odpočítané zálohové faktúry: '+fmt(prior)+' €</p>')}
function editCountry(){let x=ps[cur];header("Upraviť štát");app.innerHTML=`<section class="projectsPanel projectFormPanel"><div class="panelHeading"><div><div class="eyebrow">ÚPRAVA ZÁKAZKY</div><h2>Štát projektu</h2></div></div><div class="projectForm"><label for="projectCountry">Vyber štát</label><select id="projectCountry" class="countrySelect"><option value="">Vyber štát</option>${countryOptions.map(v=>`<option value="${v[0]}" ${(x.country||"")===v[0]?"selected":""}>${v[1]} ${v[2]}</option>`).join("")}</select><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveCountry()">Uložiť štát</button></div></div></section>`}
function saveCountry(){let country=document.getElementById("projectCountry").value;if(!country){alert("Vyber štát projektu.");return}ps[cur].country=country;save();render()}
function editOrderNumber(){const x=ps[cur];header("Číslo objednávky");app.innerHTML=`<div class="card"><h2>Číslo objednávky – ${esc(x.name)}</h2><label>Číslo objednávky</label><input id="projectOrderNumber" type="text" value="${esc(x.orderNumber||"")}" placeholder="Zadaj číslo objednávky"><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveOrderNumber()">Uložiť</button></div></div>`;document.getElementById("projectOrderNumber").focus()}
function saveOrderNumber(){ps[cur].orderNumber=document.getElementById("projectOrderNumber").value.trim();save();render()}
function editName(){let x=ps[cur];header("Upraviť projekt");app.innerHTML=`<div class="card"><h2>Názov a objednávka projektu</h2><label>Presný názov projektu</label><input id="pn" type="text" value="${esc(x.name)}"><label>Číslo objednávky</label><input id="porder" type="text" value="${esc(x.orderNumber||"")}" placeholder="Zadaj číslo objednávky, ak ho už máš"><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveName()">Uložiť</button></div></div>`;document.getElementById("pn").focus()}
function saveName(){let n=document.getElementById("pn").value.trim();if(!n){alert("Názov projektu nemôže byť prázdny.");return}ps[cur].name=n;ps[cur].orderNumber=document.getElementById("porder").value.trim();save();render()}
function editDates(){let x=ps[cur];header("Upraviť dátumy");app.innerHTML=`<div class="card"><h2>${esc(x.name)}</h2><label>Dátum začiatku projektu</label><input id="ds" type="date" value="${x.start}"><label>Dátum konca projektu</label><input id="de" type="date" value="${x.end}"><p class="muted">Po uložení sa zoznam dní automaticky prispôsobí novému rozsahu. Už zadané hodiny pre existujúce dátumy zostanú zachované.</p><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveDates()">Uložiť</button></div></div>`}
function saveDates(){let ns=document.getElementById("ds").value,ne=document.getElementById("de").value;if(!ns||!ne||D(ne)<D(ns)){alert("Dátumy nie sú správne.");return}let x=ps[cur],old=Object.fromEntries(x.days.map(d=>[d.date,d.hours]));x.start=ns;x.end=ne;x.days=days(ns,ne).map(d=>({date:d.date,hours:old[d.date]||0}));save();render()}
function edit(){let x=ps[cur];header("Upraviť");app.innerHTML=`<section class="projectsPanel projectFormPanel"><div class="panelHeading"><div><div class="eyebrow">ÚPRAVA ZÁKAZKY</div><h2>${esc(x.name)}</h2></div></div><div class="projectForm"><label for="editOrderNo">Číslo objednávky</label><input id="editOrderNo" value="${esc(x.orderNumber||"")}" placeholder="Zadaj číslo objednávky"><label for="editCountry">Štát projektu</label><select id="editCountry" class="countrySelect"><option value="">Vyber štát</option>${countryOptions.map(v=>`<option value="${v[0]}" ${(x.country||"")===v[0]?"selected":""}>${v[1]} ${v[2]}</option>`).join("")}</select><label for="er">Sadzba €/h – platí pre VŠETKY hodiny projektu</label><input id="er" type="number" step=".01" value="${x.rate}"><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveEdit()">Uložiť zmeny</button></div></div></section>`}
function saveEdit(){ps[cur].orderNumber=document.getElementById("editOrderNo").value.trim();ps[cur].country=document.getElementById("editCountry").value;ps[cur].rate=+document.getElementById("er").value||0;save();render()}
const app=document.getElementById("app");list();
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></body></html>
