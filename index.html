<!doctype html>
<html lang="sk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pracovné hodiny</title>
<style>
:root{--p:#1257b0;--p2:#2479d8;--bg:#f4f7fb;--text:#17212f;--muted:#6b7788;--border:#e5eaf0;--shadow:0 4px 16px rgba(20,45,80,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:18px 28px;font-size:23px;font-weight:800;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}
main{max-width:1120px;margin:auto;padding:24px 22px 110px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:var(--shadow);border:1px solid #142d5007}
h2{margin:0 0 12px;font-size:22px;letter-spacing:-.2px}.muted{color:var(--muted)}
.row{display:flex;gap:14px}.row>*{flex:1;min-width:0}label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:10px 0 6px}
input{width:100%;padding:12px 13px;border:1px solid #ccd5e1;border-radius:11px;background:#fff;font-size:16px;color:var(--text);outline:none}input:focus{border-color:var(--p2);box-shadow:0 0 0 3px #2479d81f}
button{border:0;border-radius:11px;padding:12px 15px;font-size:15px;font-weight:750;cursor:pointer}.primary{background:var(--p2);color:#fff}.light{background:#edf2f8;color:#20324a}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.project{display:flex;align-items:center;justify-content:space-between;gap:20px;cursor:pointer;padding:17px 18px!important;margin-bottom:10px!important;transition:.15s}.project:hover{transform:translateY(-1px);box-shadow:0 8px 24px #142d5018}
.project h2{font-size:20px;margin:0 0 5px}.project b{display:inline-block;margin-top:6px;font-size:16px}.project .arrow{font-size:30px;color:#8c98a8}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.sectionTitle h2{margin:0}
.tableWrap{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--border);text-align:left}.table th{background:#f1f5f9;color:#526071;font-size:13px;text-transform:uppercase;letter-spacing:.3px}.table tr:last-child td{border-bottom:0}.sun{background:#fff0f0;color:#c62828}.hour{width:92px;padding:9px!important;text-align:center}
.fab{position:fixed;right:30px;bottom:28px;width:62px;height:62px;border-radius:50%;font-size:32px;padding:0;box-shadow:0 8px 22px #1257b052;z-index:10}
.dateBadge{display:inline-block;padding:6px 10px;border-radius:9px;font-weight:800;min-width:86px;text-align:center}.sun .dateBadge{background:#ffe0e0;color:#c62828}.freeDay{opacity:.82}
.table tbody tr:not(.sun) .dateBadge{background:transparent;color:#111}.table tbody tr.project-start .dateBadge{background:#e9f8ed!important;color:#21743a!important}.table tbody tr.project-end .dateBadge{background:#eaf3ff!important;color:#1557b0!important}
.appLayout,.listLayout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}.sideSummary,.listSummary{position:sticky;top:82px}.sideSummary h3,.listSummary h3{margin:0 0 12px;font-size:19px}.sumItem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #e6ebf1}.sumItem:last-child{border-bottom:0}.sumValue{font-weight:800;font-size:17px}.listTotal{background:linear-gradient(135deg,#edf5ff,#f8fbff);border:1px solid #dce9f8}
.projectDate{display:inline-block;margin-top:4px;padding:5px 9px;border-radius:8px;background:#eaf3ff;color:#1557b0;font-weight:700}.projectDate.end{background:#eef8ee;color:#27733b}.projectStartInfo .dateBadge{background:#eaf3ff;color:#1557b0}.projectEndInfo .dateBadge{background:#eef8ee;color:#27733b}
.yearlyFree{margin-top:14px;padding-top:12px;border-top:1px solid #e6ebf1}.yearlyFree h4{margin:0 0 8px;font-size:15px}.yearFreeRow{display:flex;justify-content:space-between;padding:6px 0;color:#111}.yearFreeRow b{font-weight:800}
@media(max-width:850px){.appLayout,.listLayout{grid-template-columns:1fr}.sideSummary,.listSummary{position:static;order:-1}.sideSummary .summaryGrid,.listSummary .sumGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sideSummary .sumItem,.listSummary .sumItem{background:#f7f9fc;border:1px solid #e5eaf0;border-radius:10px;padding:10px}}
@media(max-width:700px){main{padding:12px 10px 100px}.card{padding:15px;border-radius:16px}.row{flex-direction:column;gap:0}.fab{right:18px;bottom:18px}.project{padding:15px!important}}

.appHeader{display:flex;align-items:center;gap:14px;min-height:78px;padding:10px 28px}
.brandLogo{width:56px;height:56px;flex:0 0 56px;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px #082b5c55}
.brandText{display:flex;flex-direction:column;gap:2px}
.brandTitle{font-size:22px;font-weight:800;letter-spacing:.1px;line-height:1.2}
.brandSubtitle{font-size:11px;font-weight:600;letter-spacing:1.15px;text-transform:uppercase;color:#dceaff}
@media(max-width:700px){.appHeader{padding:9px 14px;min-height:68px}.brandLogo{width:48px;height:48px;flex-basis:48px}.brandTitle{font-size:19px}.brandSubtitle{font-size:9px}}

/* Professional interface refresh */
:root{--p:#173b70;--p2:#2468bd;--bg:#f3f6fb;--text:#17263b;--muted:#718096;--border:#e4eaf2;--shadow:0 8px 26px rgba(25,48,82,.075);--accent:#e8c84a}
body{background:radial-gradient(ellipse at 10% 0%,#eaf1fb 0,transparent 42%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif;letter-spacing:-.01em}
header.appHeader{background:rgba(255,255,255,.96);color:var(--text);border-bottom:1px solid #e5ebf3;box-shadow:0 4px 18px rgba(20,42,72,.06);padding:12px max(28px,calc((100vw - 1160px)/2));backdrop-filter:blur(14px)}
.brandLogo{width:58px;height:58px;flex-basis:58px;border:2px solid #fff;box-shadow:0 2px 12px rgba(26,43,69,.16)}
.brandTitle{color:#173b70;font-size:23px;font-weight:850;letter-spacing:-.55px}
.brandSubtitle{color:#8794a6;font-size:10px;letter-spacing:1.55px}
main{max-width:1180px;padding:30px 24px 120px}
.card,.tableWrap{border:1px solid #e7edf5;border-radius:20px;box-shadow:var(--shadow);background:#fff}
.card{padding:22px;margin-bottom:16px}
h2{font-size:21px;font-weight:800;color:#172d4a;letter-spacing:-.45px}
.sectionTitle{margin-bottom:18px}
.sectionTitle .muted{font-size:13px;font-weight:650;background:#f1f5fa;padding:7px 11px;border-radius:20px}
.project{padding:19px 21px!important;margin-bottom:12px!important;border:1px solid #e9eef5;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.project:hover{transform:translateY(-2px);border-color:#cbdcf2;box-shadow:0 12px 28px rgba(25,55,95,.11)}
.project h2{font-size:18px;margin-bottom:8px}
.project b{font-size:15px;color:#1d3555;margin-top:9px}
.project .arrow{font-size:28px;color:#8da2bd}
.projectDate{font-size:12px;padding:6px 10px;border-radius:8px;background:#edf4ff;color:#1c5ca8}
.projectDate.end{background:#edf8f0;color:#277447}
.listLayout,.appLayout{grid-template-columns:minmax(0,1fr) 285px;gap:18px}
.listSummary,.sideSummary{top:96px}
.listTotal{background:linear-gradient(155deg,#fff 0%,#f5f9ff 100%);border:1px solid #dce7f5}
.sideSummary h3,.listSummary h3{font-size:18px;color:#19395f;margin-bottom:15px}
.sumItem{padding:12px 1px;border-bottom:1px solid #e9eef5;font-size:13px;color:#5e6d80}
.sumValue{font-size:16px;color:#172d4a;font-weight:800;font-variant-numeric:tabular-nums}
.yearlyFree{border-top:1px solid #e5ebf3}
.yearlyFree h4{font-size:13px;color:#52657d}
.yearFreeRow{font-size:13px;color:#52657d}
.yearFreeRow b{color:#1d3555}
.tableWrap{overflow:hidden}
.table{border-collapse:separate;border-spacing:0}
.table th{background:#f2f6fb;color:#62748a;font-size:11px;letter-spacing:.8px;padding:14px 16px}
.table td{padding:12px 16px;border-bottom:1px solid #edf1f6;font-size:14px}
.table tbody tr{transition:background .12s ease}
.table tbody tr:hover:not(.sun){background:#f8faff}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr.sun{background:#fff1f1;color:#c33b43}
.table tbody tr.sun:hover{background:#ffe9e9}
.table tbody tr:not(.sun) .dateBadge{color:#26384f}
.table tbody tr.project-start .dateBadge{background:#e8f7ed!important;color:#247344!important;border:1px solid #ccebd6}
.table tbody tr.project-end .dateBadge{background:#eaf2ff!important;color:#1e5ca9!important;border:1px solid #d1e1fa}
.dateBadge{font-size:13px;padding:6px 10px;border-radius:8px}
.hour{width:94px;padding:9px 10px!important;border:1px solid #d7e0ec;border-radius:10px;font-size:15px;text-align:center;font-weight:700}
input{border:1px solid #d6e0ec;border-radius:11px;padding:12px 14px;color:#20334d;background:#fff}
input:focus{border-color:#4b86cf;box-shadow:0 0 0 4px rgba(53,119,195,.12)}
label{font-size:12px;text-transform:uppercase;letter-spacing:.45px;color:#73839a;font-weight:750}
button{border-radius:11px;padding:11px 15px;font-size:13px;font-weight:750;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
button:active{transform:translateY(1px)}
.primary{background:linear-gradient(135deg,#2468bd,#174d91);color:#fff;box-shadow:0 5px 13px rgba(36,104,189,.2)}
.primary:hover{box-shadow:0 7px 17px rgba(36,104,189,.28)}
.light{background:#f0f4f9;color:#28415f;border:1px solid #e4eaf2}
.light:hover{background:#e7eef7}
.actions{gap:9px}
.fab{width:60px;height:60px;border-radius:19px;font-size:30px;right:34px;bottom:30px}
.appLayout>section>.card:first-child{padding:22px}
.appLayout>section>.card:first-child .row{gap:22px}
.appLayout>section>.card:first-child .row>div{padding:8px 0}
.appLayout>section>.card:first-child .muted{font-size:12px;font-weight:700}
.appLayout>section>.card:first-child b{color:#203c60}
.appLayout>section>.card:first-child .dateBadge{display:inline-block;margin-top:5px}
.appLayout>section>.card:first-child .actions{border-top:1px solid #edf1f6;padding-top:15px}
.appLayout>section>button.light{margin-top:2px}
@media(max-width:850px){header.appHeader{padding:10px 18px}.listLayout,.appLayout{grid-template-columns:1fr}.sideSummary,.listSummary{position:static;order:0}.listSummary .sumGrid,.sideSummary .summaryGrid{grid-template-columns:1fr 1fr;gap:7px}.listSummary .sumItem,.sideSummary .sumItem{background:#fff;border:1px solid #e7edf5;border-radius:11px;padding:10px}}
@media(max-width:700px){main{padding:14px 11px 100px}.card{padding:16px;border-radius:16px}.brandLogo{width:48px;height:48px;flex-basis:48px}.brandTitle{font-size:19px}.brandSubtitle{font-size:9px}.project{padding:15px!important}.project h2{font-size:16px}.fab{right:17px;bottom:17px;width:56px;height:56px;border-radius:17px}.table th,.table td{padding:10px 8px}.table td{font-size:13px}.hour{width:82px}.actions button{flex:1}.appLayout>section>.card:first-child .row{gap:8px}}
</style></head>

<script>
const K="ph_demo";let ps=JSON.parse(localStorage.getItem(K)||"[]"),cur=-1;
const fmt=n=>Number(n||0).toLocaleString("sk-SK",{minimumFractionDigits:2,maximumFractionDigits:2});
const D=s=>{let[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)},iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`};
const sd=s=>D(s).toLocaleDateString("sk-SK"),dn=s=>["Ne","Po","Ut","St","Št","Pi","So"][D(s).getDay()];
const dayClass=s=>D(s).getDay()===0?"sun":"";
function save(){localStorage.setItem(K,JSON.stringify(ps))}
function days(a,b){let r=[],d=D(a),e=D(b);while(d<=e){r.push({date:iso(d),hours:0});d.setDate(d.getDate()+1)}return r}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function annualFreeSummary(){
 const dates={};
 ps.forEach(x=>x.days.forEach(d=>{dates[d.date]=(dates[d.date]||0)+(+d.hours||0)}));
 const years=new Set([String(new Date().getFullYear()),...Object.keys(dates).map(date=>date.slice(0,4))]);
 return [...years].sort().map(year=>{
  const worked=Object.entries(dates).filter(([date,hours])=>date.startsWith(year)&&hours>0).length;
  const daysInYear=(new Date(+year+1,0,1)-new Date(+year,0,1))/86400000;
  return {year,worked,free:daysInYear-worked};
 });
}
function list(){
 header("Pracovné hodiny");let totalH=0,totalE=0,totalAdvance=0;
 ps.forEach(x=>{totalH+=x.days.reduce((a,d)=>a+ +d.hours,0);totalE+=x.days.reduce((a,d)=>a+ +d.hours,0)*x.rate;totalAdvance+=+x.advance||0});
 const annual=annualFreeSummary(),currentYear=new Date().getFullYear(),current=annual.find(y=>String(y.year)===String(currentYear)),free=current?.free||365,worked=current?.worked||0,period=(new Date(currentYear+1,0,1)-new Date(currentYear,0,1))/86400000;
 const annualHTML=annual.map(y=>`<div class="yearFreeRow"><span>${y.year}</span><b>${y.free} dní</b></div>`).join("");
 const ordered=ps.map((x,i)=>({x,i})).sort((a,b)=>D(a.x.start)-D(b.x.start));
 app.innerHTML=`<div class="listLayout"><section class="card"><div class="sectionTitle"><h2>Projekty</h2><span class="muted">${ps.length} ${ps.length==1?"projekt":"projektov"}</span></div><div id="p"></div><div class="actions" style="margin-top:16px;justify-content:flex-start"><button class="light" onclick="backupData()">💾 Uložiť údaje</button><button class="light" onclick="document.getElementById('restoreFile').click()">📂 Obnoviť údaje</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)"></div></section><aside class="card listSummary listTotal"><h3>📊 Celkový súhrn</h3><div class="sumGrid"><div class="sumItem"><span>Hodiny spolu</span><span class="sumValue">${fmt(totalH)} h</span></div><div class="sumItem"><span>Zárobok spolu</span><span class="sumValue">${fmt(totalE)} €</span></div><div class="sumItem"><span>Odpracované dni</span><span class="sumValue">${worked}</span></div><div class="sumItem"><span>Voľno v roku ${currentYear}</span><span class="sumValue">${free}</span></div><div class="sumItem"><span>Obdobie</span><span class="sumValue">${period} dní</span></div><div class="sumItem"><span>Zálohy</span><span class="sumValue">${fmt(totalAdvance)} €</span></div><div class="sumItem"><span>Ostatok</span><span class="sumValue">${fmt(totalE-totalAdvance)} €</span></div></div><div class="yearlyFree"><h4>Voľno podľa rokov</h4>${annualHTML||'<p class="muted">Zatiaľ bez evidovaných dní.</p>'}</div></aside></div><button class="fab primary" onclick="newP()">+</button>`;
 let p=document.querySelector("#p");if(!ps.length){p.innerHTML='<p class="muted">Zatiaľ nemáš žiadny projekt.</p>';return}
 ordered.forEach(({x,i})=>{let h=x.days.reduce((a,d)=>a+ +d.hours,0);p.innerHTML+=`<div class="card project" onclick="openP(${i})"><div><h2>${esc(x.name)}</h2><div><span class="projectDate">Od: ${sd(x.start)}</span> <span class="projectDate end">Do: ${sd(x.end)}</span></div><b>${fmt(h)} h | ${fmt(h*x.rate)} €</b></div><span class="arrow">›</span></div>`});
}
function header(t){document.querySelector("#appTitle").textContent=t}
function backupData(){const data={version:1,app:"Pracovné hodiny",savedAt:new Date().toISOString(),projects:ps};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Pracovne_hodiny_zaloha.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreData(event){const file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.projects))throw new Error("bad");if(!confirm("Obnoviť uložené údaje? Aktuálne údaje sa nahradia zálohou."))return;ps=data.projects;save();list();alert("Údaje boli obnovené.")}catch(e){alert("Tento súbor nie je platná záloha aplikácie.")}event.target.value=""};reader.readAsText(file)}
function newP(){header("Nový projekt");app.innerHTML=`<div class="card"><h2>Nový projekt</h2><label>Názov projektu</label><input id="n" placeholder="napr. Holandsko"><div class="row"><div><label>Začiatok</label><input id="s" type="date"></div><div><label>Koniec</label><input id="e" type="date"></div></div><div class="row"><div><label>Sadzba €/h</label><input id="r" type="number" value="15" step=".01"></div><div><label>Záloha €</label><input id="a" type="number" value="0" step=".01"></div></div><div class="actions"><button class="light" onclick="list()">Zrušiť</button><button class="primary" onclick="create()">⚡ Vygenerovať dni</button></div></div>`}
function create(){let n=document.getElementById("n").value.trim(),s=document.getElementById("s").value,e=document.getElementById("e").value;if(!n||!s||!e||D(e)<D(s)){alert("Vyplň údaje správne.");return}ps.push({name:n,start:s,end:e,rate:+document.getElementById("r").value||0,advance:+document.getElementById("a").value||0,days:days(s,e)});save();openP(ps.length-1)}
function openP(i){cur=i;render()}
function render(){let x=ps[cur],h=x.days.reduce((a,d)=>a+ +d.hours,0),workedDays=x.days.filter(d=>+d.hours>0).length,freeDays=x.days.filter(d=>+d.hours===0).length,total=x.days.length,earn=h*x.rate;header(x.name);app.innerHTML=`<div class="appLayout"><section><div class="card"><div class="row"><div><span class="muted">Začiatok</span><br><b class="projectStartInfo"><span class="dateBadge">${sd(x.start)}</span></b></div><div><span class="muted">Sadzba</span><br><b>${fmt(x.rate)} € / h</b></div></div><div class="row"><div><span class="muted">Koniec</span><br><b class="projectEndInfo"><span class="dateBadge">${sd(x.end)}</span></b></div><div><span class="muted">Záloha</span><br><b>${fmt(x.advance)} €</b></div></div><div class="actions"><button class="light" onclick="editName()">✏️ Upraviť názov</button><button class="light" onclick="editDates()">📅 Upraviť dátumy</button><button class="light" onclick="edit()">✏️ Upraviť sadzbu / zálohu</button></div></div><div class="tableWrap"><table class="table"><thead><tr><th>Deň</th><th>Dátum</th><th>Hodiny</th></tr></thead><tbody>${x.days.map((d,j)=>{let free=+d.hours===0;return `<tr class="${dayClass(d.date)} ${d.date===x.start?"project-start":""} ${d.date===x.end?"project-end":""} ${free?"freeDay":""}"><td><b>${dn(d.date)}</b></td><td><span class="dateBadge" style="${d.date===x.start?'background:#e9f8ed!important;color:#21743a!important':d.date===x.end?'background:#eaf3ff!important;color:#1557b0!important':''}">${sd(d.date)}</span></td><td><input class="hour" type="number" min="0" step=".25" value="${d.hours||""}" placeholder="0" onchange="ps[cur].days[${j}].hours=+this.value||0;save();render()"></td></tr>`}).join("")}</tbody></table></div><button class="light" onclick="list()">← Späť</button></section><aside class="card sideSummary"><h3>📊 Súhrn projektu</h3><div class="summaryGrid"><div class="sumItem"><span>Hodiny</span><span class="sumValue">${fmt(h)} h</span></div><div class="sumItem"><span>Zárobok</span><span class="sumValue">${fmt(earn)} €</span></div><div class="sumItem"><span>Odpracované dni</span><span class="sumValue">${workedDays}</span></div><div class="sumItem"><span>Voľno</span><span class="sumValue">${freeDays}</span></div><div class="sumItem"><span>Celé obdobie</span><span class="sumValue">${total} dní</span></div><div class="sumItem"><span>Ostatok</span><span class="sumValue">${fmt(earn-x.advance)} €</span></div></div></aside></div>`}
function editName(){let x=ps[cur];header("Upraviť názov");app.innerHTML=`<div class="card"><h2>Názov projektu</h2><label>Názov</label><input id="pn" type="text" value="${esc(x.name)}"><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveName()">Uložiť</button></div></div>`;document.getElementById("pn").focus()}
function saveName(){let n=document.getElementById("pn").value.trim();if(!n){alert("Názov projektu nemôže byť prázdny.");return}ps[cur].name=n;save();render()}
function editDates(){let x=ps[cur];header("Upraviť dátumy");app.innerHTML=`<div class="card"><h2>${esc(x.name)}</h2><label>Dátum začiatku projektu</label><input id="ds" type="date" value="${x.start}"><label>Dátum konca projektu</label><input id="de" type="date" value="${x.end}"><p class="muted">Po uložení sa zoznam dní automaticky prispôsobí novému rozsahu. Už zadané hodiny pre existujúce dátumy zostanú zachované.</p><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveDates()">Uložiť</button></div></div>`}
function saveDates(){let ns=document.getElementById("ds").value,ne=document.getElementById("de").value;if(!ns||!ne||D(ne)<D(ns)){alert("Dátumy nie sú správne.");return}let x=ps[cur],old=Object.fromEntries(x.days.map(d=>[d.date,d.hours]));x.start=ns;x.end=ne;x.days=days(ns,ne).map(d=>({date:d.date,hours:old[d.date]||0}));save();render()}
function edit(){let x=ps[cur];header("Upraviť");app.innerHTML=`<div class="card"><h2>${esc(x.name)}</h2><label>Sadzba €/h – platí pre VŠETKY hodiny projektu</label><input id="er" type="number" step=".01" value="${x.rate}"><label>Záloha €</label><input id="ea" type="number" step=".01" value="${x.advance}"><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveEdit()">Uložiť</button></div></div>`}
function saveEdit(){ps[cur].rate=+document.getElementById("er").value||0;ps[cur].advance=+document.getElementById("ea").value||0;save();render()}
const app=document.getElementById("app");list();
</script></body></html>
