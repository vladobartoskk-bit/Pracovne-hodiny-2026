<script>
const K="ph_demo";let ps=JSON.parse(localStorage.getItem(K)||"[]"),cur=-1;
const fmt=n=>Number(n||0).toLocaleString("sk-SK",{minimumFractionDigits:2,maximumFractionDigits:2});
const D=s=>{let[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)},iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`};
const sd=s=>D(s).toLocaleDateString("sk-SK"),dn=s=>["Ne","Po","Ut","St","Št","Pi","So"][D(s).getDay()];
const dayClass=s=>D(s).getDay()===0?"sun":"";
function save(){localStorage.setItem(K,JSON.stringify(ps))}
const TK=K+"_travel";
let travelTrips=JSON.parse(localStorage.getItem(TK)||"[]");
function saveTravel(){localStorage.setItem(TK,JSON.stringify(travelTrips))}
function travelHours(t){return Math.max(0,(new Date(t.end)-new Date(t.start))/3600000)}
function travelTotals(){const hours=travelTrips.reduce((n,t)=>n+travelHours(t),0);return {hours,days:hours/24}}
function travelDateSet(year){const out=new Set();travelTrips.forEach(t=>{if(!t.start||!t.end)return;let d=new Date(t.start),e=new Date(t.end);d=new Date(d.getFullYear(),d.getMonth(),d.getDate());e=new Date(e.getFullYear(),e.getMonth(),e.getDate());while(d<=e){const key=iso(d);if(key.startsWith(String(year)))out.add(key);d.setDate(d.getDate()+1)}});return out}
function yearDayStats(year){const a=new Date(+year,0,1),z=new Date(+year+1,0,1),project=new Set(),worked=new Set();ps.forEach(p=>p.days.forEach(d=>{if(d.date.startsWith(String(year))){project.add(d.date);if(+d.hours>0)worked.add(d.date)}}));const travel=travelDateSet(year);let home=0,projectFree=0;for(let d=new Date(a);d<z;d.setDate(d.getDate()+1)){const k=iso(d);if(travel.has(k)||worked.has(k))continue;if(project.has(k))projectFree++;else home++}return {worked:worked.size,projectFree,home,travel:travel.size,total:(z-a)/86400000}}
let travelDraftCount=1;
function travelSegmentRow(i,s={}){return `<div class="travelSegment" data-segment="${i}"><b>Úsek ${i+1}</b><label>Doprava<select id="travelMode${i}"><option value="car" ${s.mode==="car"?"selected":""}>🚗 Auto</option><option value="plane" ${s.mode==="plane"?"selected":""}>✈️ Lietadlo</option><option value="bus" ${s.mode==="bus"?"selected":""}>🚌 Autobus</option><option value="train" ${s.mode==="train"?"selected":""}>🚆 Vlak</option><option value="taxi" ${s.mode==="taxi"?"selected":""}>🚕 Taxi</option><option value="ship" ${s.mode==="ship"?"selected":""}>🚢 Loď</option><option value="other" ${s.mode==="other"?"selected":""}>Iné</option></select></label><label>Odkiaľ <input id="travelFrom${i}" value="${esc(s.from||"")}" placeholder="Napr. domov / letisko"></label><label>Kam <input id="travelTo${i}" value="${esc(s.to||"")}" placeholder="Napr. letisko / hotel"></label><label>Odchod <input id="travelSegStart${i}" type="datetime-local" value="${s.start||""}"></label><label>Príchod <input id="travelSegEnd${i}" type="datetime-local" value="${s.end||""}"></label></div>`}
function renderProjectTravelCards(){const host=document.getElementById("projectTravelCards");if(!host)return;const trips=travelTrips.filter(t=>t.projectIndex===cur||(!Number.isInteger(t.projectIndex)&&t.projectName===ps[cur].name));host.innerHTML=trips.map(t=>{const segs=t.segments||[{mode:"other",from:"Cesta",to:"",start:t.start,end:t.end}];return '<article class="tripCard"><div class="tripHead"><b>'+esc(t.projectName||ps[cur].name)+'</b><span class="tripPill">'+new Date(t.start).toLocaleDateString("sk-SK")+' – '+new Date(t.end).toLocaleDateString("sk-SK")+'</span><span class="tripPill">'+travelHours(t).toFixed(2)+' h</span><span class="tripPill purple">'+(travelHours(t)/24).toFixed(2)+' dni</span><button class="tripDelete" onclick="removeTravel('+t.id+');render()">×</button></div><div class="tripTimeline">'+segs.map(g=>'<div class="tripLeg"><span class="legIcon '+g.mode+'">'+({car:"🚗",plane:"✈️",bus:"🚌",train:"🚆",taxi:"🚕",ship:"🚢",other:"↗"}[g.mode]||"↗")+'</span><b class="legRoute">'+esc(g.from||"—")+' → '+esc(g.to||"—")+'</b><span class="legTime">'+new Date(g.start).toLocaleString("sk-SK")+'</span><span class="legTime">'+new Date(g.end).toLocaleString("sk-SK")+'</span><b class="legDuration">'+travelHours(g).toFixed(2)+' h</b></div>').join("")+'</div><div class="tripTotal">◷ Celkové trvanie cesty: <b>'+travelHours(t).toFixed(2)+' h</b> | Prepočet na dni: <b>'+(travelHours(t)/24).toFixed(2)+' dni</b></div></article>'}).join("")||'<div class="emptyTrips">K tomuto projektu zatiaľ nie je priradená žiadna cesta.</div>'}
function renderTravelCards(){const host=document.getElementById("travelCards");if(!host)return;const labels={car:"🚗 Auto",plane:"✈️ Lietadlo",bus:"🚌 Autobus",train:"🚆 Vlak",taxi:"🚕 Taxi",ship:"🚢 Loď",other:"Iné"};host.innerHTML=travelTrips.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(t=>{const segs=t.segments||[{mode:"other",from:"Cesta",to:"",start:t.start,end:t.end}];return '<article class="tripCard"><div class="tripHead"><span class="tripPlane">✈</span><b>'+segs.map(s=>esc(s.from||"")).filter(Boolean)[0]+' – '+esc(segs[segs.length-1].to||"Cesta")+'</b><span class="tripPill">'+new Date(t.start).toLocaleDateString("sk-SK")+' – '+new Date(t.end).toLocaleDateString("sk-SK")+'</span><span class="tripPill">'+travelHours(t).toFixed(2)+' h</span><span class="tripPill purple">'+(travelHours(t)/24).toFixed(2)+' dni</span><button class="tripDelete" onclick="removeTravel('+t.id+');list()">×</button></div><div class="tripTimeline">'+segs.map(g=>'<div class="tripLeg"><span class="legIcon '+g.mode+'">'+(labels[g.mode]||"↗")+'</span><b class="legRoute">'+esc(g.from||"—")+' → '+esc(g.to||"—")+'</b><span class="legTime">'+new Date(g.start).toLocaleString("sk-SK")+'</span><span class="legTime">'+new Date(g.end).toLocaleString("sk-SK")+'</span><b class="legDuration">'+travelHours(g).toFixed(2)+' h</b></div>').join("")+'</div><div class="tripTotal">◷ &nbsp; Celkové trvanie cesty: <b>'+travelHours(t).toFixed(2)+' h</b> &nbsp; | &nbsp; Prepočet na dni: <b>'+(travelHours(t)/24).toFixed(2)+' dni</b></div></article>'}).join("")||'<div class="emptyTrips">Zatiaľ bez ciest. Pridaj prvú cestu.</div>'}
let activeTravelProject=null;
function openTravelEditor(projectIndex=null){activeTravelProject=Number.isInteger(projectIndex)?projectIndex:null;const host=document.getElementById(activeTravelProject!==null?"projectTravelEditor":"travelEditor");if(!host)return;travelDraftCount=1;const opts=ps.map((p,i)=>`<option value="${i}" ${activeTravelProject===i?"selected":""}>${esc(p.name)}</option>`).join("");host.innerHTML='<div class="travelEditor"><h3>Nová cesta</h3><label class="travelProjectPick">Priradiť k projektu <select id="travelProjectSelect"><option value="">Bez priradenia</option>'+opts+'</select></label><div id="travelSegments">'+travelSegmentRow(0)+'</div><div class="travelEditorActions"><button class="light" onclick="addTravelSegment()">＋ Pridať úsek</button><button class="primary" onclick="addTravel()">Uložiť cestu</button><button class="light" onclick="document.getElementById(\''+(activeTravelProject!==null?"projectTravelEditor":"travelEditor")+'\').innerHTML=\'\'">Zrušiť</button></div></div>'}
function addTravelSegment(){const rows=document.querySelectorAll(".travelSegment");travelDraftCount=rows.length+1;const host=document.getElementById("travelSegments");host.insertAdjacentHTML("beforeend",travelSegmentRow(travelDraftCount-1));}
function addTravel(){const segments=[...document.querySelectorAll(".travelSegment")].map((el,i)=>({mode:document.getElementById("travelMode"+i).value,from:document.getElementById("travelFrom"+i).value.trim(),to:document.getElementById("travelTo"+i).value.trim(),start:document.getElementById("travelSegStart"+i).value,end:document.getElementById("travelSegEnd"+i).value}));if(!segments.length||segments.some(s=>!s.start||!s.end||new Date(s.end)<new Date(s.start))){alert("Vyplň dátum a čas odchodu aj príchodu pri každom úseku.");return}segments.sort((a,b)=>new Date(a.start)-new Date(b.start));const start=segments[0].start,end=segments[segments.length-1].end;if(segments.some((s,i)=>i&&new Date(s.start)<new Date(segments[i-1].end))){alert("Časy jednotlivých úsekov sa prekrývajú. Skontroluj ich, prosím.");return}const selectedProject=document.getElementById("travelProjectSelect")?.value??"";const projectIndex=selectedProject===""?null:Number(selectedProject);travelTrips.push({id:Date.now(),start,end,segments,projectIndex,projectName:projectIndex!==null?ps[projectIndex].name:null});saveTravel();travelDraftCount=1;if(projectIndex!==null){activeTravelProject=null;cur=projectIndex;render()}else{activeTravelProject=null;list()}}

function removeTravel(id){travelTrips=travelTrips.filter(t=>t.id!==id);saveTravel();settingsView()}
function days(a,b){let r=[],d=D(a),e=D(b);while(d<=e){r.push({date:iso(d),hours:0});d.setDate(d.getDate()+1)}return r}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function annualFreeSummary(){const years=new Set([String(new Date().getFullYear()),...ps.flatMap(p=>p.days.map(d=>d.date.slice(0,4))),...travelTrips.map(t=>t.start.slice(0,4))]);return [...years].sort().map(year=>{const s=yearDayStats(year);return {...s,year,free:s.home+s.projectFree}})}

function flagFor(name){const s=(name||"").toLowerCase();if(/swe|sweden|švéd|halmstad|kungälv|kungens/.test(s))return "🇸🇪";if(/fi|finland|turku/.test(s))return "🇫🇮";if(/es|spain|špan|pamplona|málaga|malaga/.test(s))return "🇪🇸";if(/nor|nór|askim|oslo/.test(s))return "🇳🇴";if(/nl|nether|holand|maastricht|waalwijk|arnhem/.test(s))return "🇳🇱";if(/de|german|braunschweig/.test(s))return "🇩🇪";if(/dubai|uae|emir/.test(s))return "🇦🇪";return "🌍"}
let calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function shiftCalendar(delta){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+delta,1);calendarView()}
function calendarProjectColor(i){const colors=["#dbeafe","#fce7f3","#ffedd5","#e9d5ff","#ccfbf1","#fef3c7","#e0e7ff","#fee2e2","#d1fae5","#f3e8ff","#cffafe","#fce7f3"];return colors[i%colors.length]}
function calendarView(){header("Kalendár");const year=calendarCursor.getFullYear(),month=calendarCursor.getMonth(),first=new Date(year,month,1),last=new Date(year,month+1,0),names=["Ne","Po","Ut","St","Št","Pi","So"];let html="";for(let i=0;i<first.getDay();i++)html+='<div class="calendarBlank"></div>';for(let day=1;day<=last.getDate();day++){const key=year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");const entries=ps.map((p,i)=>({p,i,d:p.days.find(d=>d.date===key)})).filter(x=>x.d);const hours=entries.reduce((a,x)=>a+(+x.d.hours||0),0);const travel=travelDateSet(year).has(key),inProject=entries.length>0,dayType=travel?"travelDay":hours>0?"workedDay":inProject?"projectFreeDay":"homeFreeDay";const chips=entries.map(x=>`<button class="calendarProject" style="--project-chip:${calendarProjectColor(x.i)}" onclick="event.stopPropagation();openP(${x.i})" title="${esc(x.p.name)}">${flagFor(x.p.country||x.p.name)} ${esc(x.p.name)} · ${fmt(+x.d.hours||0)} h</button>`).join("");html+=`<div class="calendarDay ${hours?"hasHours":""} ${dayType} ${new Date(year,month,day).getDay()===0?"sunday":""}"><b>${day}</b><span>${hours?fmt(hours)+" h spolu":travel?"Cestovanie":inProject?"Voľno na projekte":"Voľno doma"}</span><div class="calendarEntries">${chips}</div></div>`}app.innerHTML=`<section class="projectsPanel calendarPanel"><div class="calendarToolbar"><button class="calendarArrow" onclick="shiftCalendar(-1)" aria-label="Predchádzajúci mesiac">‹</button><div><h2>${first.toLocaleDateString("sk-SK",{month:"long",year:"numeric"})}</h2><span class="muted">Prehľad hodín a projektov podľa dní</span></div><button class="calendarArrow" onclick="shiftCalendar(1)" aria-label="Nasledujúci mesiac">›</button><button class="calendarToday" onclick="calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);calendarView()">Dnes</button></div><div class="calendarGrid">${names.map(n=>`<b class="calendarName">${n}</b>`).join("")}${html}</div><div class="calendarLegend"><span><i class="legendDot worked"></i> Práca</span><span><i class="legendDot projectFreeDot"></i> Voľno na projekte</span><span><i class="legendDot homeFreeDot"></i> Voľno doma</span><span><i class="legendDot travelDot"></i> Cestovanie</span><span><i class="legendDot sundayDot"></i> Nedeľa</span><span>Kliknutím na projekt otvoríš jeho dennú evidenciu</span></div></section>`}
function statsView(){header("Štatistiky");let hours=0,earn=0,worked=0;ps.forEach(p=>p.days.forEach(d=>{let h=+d.hours||0;hours+=h;earn+=h*p.rate;if(h>0)worked++}));const colors=["#1685ed","#8b5cf6","#f59e0b","#10b981","#ec4899","#06b6d4","#eab308","#64748b","#f43f5e","#84cc16","#a855f7","#14b8a6"];const sorted=ps.map((p,i)=>({p,i,h:p.days.reduce((s,d)=>s+(+d.hours||0),0)})).sort((a,b)=>b.h-a.h);const rows=sorted.map(x=>{const share=hours?x.h/hours*100:0,col=colors[x.i%colors.length];return '<tr><td><span class="statsProjectName"><i style="--project-color:'+col+'"></i><b>'+esc(x.p.name)+'</b></span></td><td><strong>'+fmt(x.h)+' h</strong><div class="statsBar"><span style="width:'+share+'%;--project-color:'+col+'"></span></div></td><td class="statsMoney">'+fmt(x.h*x.p.rate)+' €</td><td><span class="statsShare">'+share.toFixed(1).replace(".",",")+' %</span></td></tr>'}).join("");let pos=0;const donutStops=sorted.filter(x=>x.h>0).map(x=>{const start=pos;pos+=x.h/hours*100;return colors[x.i%colors.length]+" "+start.toFixed(2)+"% "+pos.toFixed(2)+"%"}).join(",");const donutStyle=hours?"conic-gradient("+donutStops+")":"#e8eef6";const legend=sorted.slice(0,7).map(x=>'<div><i style="background:'+colors[x.i%colors.length]+'"></i><span>'+esc(x.p.name)+'</span><b>'+(hours?(x.h/hours*100).toFixed(1).replace(".",","):"0,0")+' %</b></div>').join("");app.innerHTML='<section class="statsPage"><div class="statsIntro"><div><div class="statsEyebrow">PREHĽAD A VÝKON</div><h2>Štatistiky práce</h2><p>Prehľad odpracovaného času, zárobkov a jednotlivých projektov</p></div><div class="statsYear"><span>Rozsah evidencie</span><b>Všetky projekty</b></div></div><div class="statsKpis"><article class="statsKpi blue"><small>Hodiny spolu</small><strong>'+fmt(hours)+' <i>h</i></strong><em>Celkový odpracovaný čas</em></article><article class="statsKpi green"><small>Zárobok spolu</small><strong>'+fmt(earn)+' <i>€</i></strong><em>Súčet podľa sadzieb projektov</em></article><article class="statsKpi orange"><small>Odpracované dni</small><strong>'+worked+'</strong><em>Dni so zaznamenanými hodinami</em></article><article class="statsKpi violet"><small>Počet projektov</small><strong>'+ps.length+'</strong><em>Všetky evidované projekty</em></article></div><div class="statsContent"><section class="statsTableCard"><div class="statsCardHead"><div><h3>Prehľad podľa projektov</h3><p>Zoradené od najväčšieho počtu hodín</p></div><span class="statsCount">'+sorted.length+' projektov</span></div><div class="statsTableWrap"><table class="statsTable"><thead><tr><th>Projekt</th><th>Odpracované hodiny</th><th>Zárobok</th><th>Podiel</th></tr></thead><tbody>'+rows+'</tbody></table></div></section><aside class="statsSideCard"><div class="statsCardHead"><div><h3>Rozdelenie hodín</h3><p>Podiel jednotlivých projektov</p></div></div><div class="statsDonutArea"><div class="statsDonut" style="background:'+donutStyle+'"><div><b>'+fmt(hours)+'</b><small>hodín spolu</small></div></div></div><div class="statsMiniLegend">'+legend+(sorted.length>7?'<small>+ '+(sorted.length-7)+' ďalších projektov v tabuľke</small>':"")+'</div></aside></div></section>'}
function settingsView(){header("Nastavenia");travelDraftCount=1;app.innerHTML=`<section class="projectsPanel"><div class="panelHeading"><h2>Nastavenia a záloha údajov</h2></div><div class="backupBar"><div><b>Evidencia cestovania</b><span>Rozdeľ cestu na jednotlivé úseky. Pri každom vyber dopravu, trasu a presný čas.</span></div><div id="travelSegments">${travelSegmentRow(0)}</div><div class="travelForm"><button class="light" onclick="addTravelSegment()">＋ Pridať ďalší úsek</button><button class="primary" onclick="addTravel()">Uložiť celú cestu</button></div><small class="muted">Príklad: domov → letisko autobusom, let lietadlom, letisko → hotel autom.</small></div><div class="backupBar"><div><b>Zaznamenané cesty</b><span>${travelTrips.length} ciest · ${travelTotals().hours.toFixed(1)} h · ${travelTotals().days.toFixed(2)} dňa</span></div><div class="travelList">${travelTrips.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(t=>`<div class="travelTripCard"><b>${t.segments?.length||1} úsekov</b><span>${(t.segments||[]).map(s=>({car:"🚗 Auto",plane:"✈️ Lietadlo",bus:"🚌 Autobus",train:"🚆 Vlak",taxi:"🚕 Taxi",ship:"🚢 Loď",other:"Iné"}[s.mode]||"Doprava")+" · "+esc(s.from||"")+" → "+esc(s.to||"")).join("<br>")||"Cesta"}</span><small>${new Date(t.start).toLocaleString("sk-SK")} → ${new Date(t.end).toLocaleString("sk-SK")} · ${travelHours(t).toFixed(1)} h = ${(travelHours(t)/24).toFixed(2)} dňa</small><button class="light" onclick="removeTravel(${t.id})">Odstrániť cestu</button></div>`).join("")||"Zatiaľ bez ciest"}</div></div><div class="backupBar"><div><b>Exportovať údaje</b><span>Stiahni si bezpečnostnú kópiu všetkých projektov.</span></div><button class="primary" onclick="backupData()">⇩ Uložiť zálohu</button></div><div class="backupBar"><div><b>Obnoviť údaje</b><span>Načítaj predtým uložený JSON súbor.</span></div><input type="file" accept=".json,application/json" onchange="restoreData(event)"></div><div class="backupBar"><div><b>Počet uložených projektov</b><span>${ps.length} projektov v tejto aplikácii</span></div></div></section>`}
function list(){
header("Pracovné hodiny");const currentYear=new Date().getFullYear();let totalH=0,totalE=0,totalAdvance=0;
ps.forEach(x=>{const yearHours=x.days.filter(d=>d.date.startsWith(String(currentYear))).reduce((a,d)=>a+(+d.hours||0),0);totalH+=yearHours;totalE+=yearHours*x.rate;totalAdvance+=+x.advance||0});
const annual=annualFreeSummary(),current=yearDayStats(currentYear),free=current.home+current.projectFree,worked=current.worked,period=current.total;
const annualHTML=annual.map(y=>`<div class="yearFreeRow"><span>${y.year}</span><b>${y.free} dní voľna</b></div>`).join("");
const ordered=ps.map((x,i)=>({x,i})).sort((a,b)=>D(a.x.start)-D(b.x.start));
app.innerHTML=`<div class="dashboard"><section class="welcomePanel"><div><div class="eyebrow">OSOBNÁ EVIDENCIA PRÁCE</div><h1>Prehľad pracovných projektov</h1><p>Všetky tvoje zákazky, odpracované hodiny a zárobky na jednom mieste.</p></div><button class="primary newProjectBtn" onclick="newP()">＋ Nový projekt</button></section>
<section class="metricGrid"><div class="metricCard"><span class="metricIcon">◷</span><span class="metricLabel">Odpracované hodiny</span><strong>${fmt(totalH)} <small>h</small></strong><span class="metricFoot">Spolu za všetky projekty</span></div><div class="metricCard"><span class="metricIcon">€</span><span class="metricLabel">Celkový zárobok</span><strong>${fmt(totalE)} <small>€</small></strong><span class="metricFoot">Pred odpočítaním záloh</span></div><div class="metricCard"><span class="metricIcon">✓</span><span class="metricLabel">Odpracované dni</span><strong>${worked}</strong><span class="metricFoot">Z roka ${currentYear}</span></div><div class="metricCard"><span class="metricIcon">⌂</span><span class="metricLabel">Voľno doma</span><strong>${current.home}</strong><span class="metricFoot">Mimo projektov a ciest</span></div><div class="metricCard"><span class="metricIcon">☕</span><span class="metricLabel">Voľno na projektoch</span><strong>${current.projectFree}</strong><span class="metricFoot">Dni bez odpracovaných hodín</span></div><div class="metricCard"><span class="metricIcon">✈</span><span class="metricLabel">Cestovné dni</span><strong>${current.travel}</strong><span class="metricFoot">Podľa dátumov a časov ciest</span></div></section>
<div class="workspace"><section class="projectsPanel"><div class="panelHeading"><div><div class="eyebrow">ZOZNAM ZÁKAZIEK</div><h2>Moje projekty</h2></div><div class="projectHeadingActions"><span class="countPill">${ps.length} projektov</span><button class="primary addProjectAction" onclick="newP()">＋ Nový projekt</button></div></div><div id="p" class="projectGrid"></div><div class="backupBar"><div><b>Záloha údajov</b><span>Ulož si evidenciu alebo obnov predchádzajúcu zálohu.</span></div><div class="backupActions"><button class="light" onclick="backupData()">↓ Uložiť zálohu</button><button class="light" onclick="document.getElementById('restoreFile').click()">↑ Obnoviť zálohu</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)"></div></div></section>
<aside class="summaryPanel"><div class="panelHeading"><h2>Celková štatistika (rok ${currentYear})</h2></div><div class="referenceStats"><div class="referenceDonut" style="--work:${current.worked/period*100}%;--project:${(current.worked+current.projectFree)/period*100}%;--home:${(current.worked+current.projectFree+current.home)/period*100}%"><div><b>${period}</b><small>dní</small></div></div><div class="referenceLegend"><div><i class="greenDot"></i>Práca <b>${current.worked} dní</b><strong>${fmt(totalH)} h</strong></div><div><i class="orangeDot"></i>Voľno na projekte <b>${current.projectFree} dní</b></div><div><i class="blueDot"></i>Voľno doma <b>${current.home} dní</b></div><div><i class="violetDot"></i>Cestovanie <b>${current.travel} dní</b><strong>${travelTotals().hours.toFixed(1)} h</strong></div></div></div><div class="referenceEarnings"><span>▤</span><b>Celkový zárobok</b><strong>${fmt(totalE)} €</strong></div></aside></div></div>`;
const p=document.querySelector("#p");if(!ps.length){p.innerHTML='<div class="emptyState"><div>▤</div><b>Zatiaľ tu nemáš žiadny projekt</b><span>Pridaj prvý projekt a začni evidovať odpracované hodiny.</span><button class="primary" onclick="newP()">＋ Pridať projekt</button></div>';return}
let shownYear="";ordered.forEach(({x,i})=>{const groupYear=x.start.slice(0,4);if(groupYear!==shownYear){shownYear=groupYear;p.innerHTML+=`<div class="projectYearHeading"><span>📅 Projekty – rok ${groupYear}</span><small>${ordered.filter(o=>o.x.start.slice(0,4)===groupYear).length} projektov</small></div>`}let h=x.days.filter(d=>d.date.startsWith(groupYear)).reduce((a,d)=>a+(+d.hours||0),0);p.innerHTML+=`<article class="projectCard" style="--project-accent:${countryAccent(x.country||x.name)}" onclick="openP(${i})"><div class="projectCardTop"><span class="projectMark">${flagFor(x.country||x.name)}</span><span class="projectArrow">↗</span></div><h3>${esc(x.name)}</h3><div class="projectDates"><span><i>OD</i>${sd(x.start)}</span><span><i>DO</i>${sd(x.end)}</span></div><div class="projectCardBottom"><b>${fmt(h)} h</b><span>${fmt(h*x.rate)} €</span></div></article>`});
}
function header(t){document.querySelector("#appTitle").textContent=t;document.querySelectorAll(".navTab").forEach((b,i)=>b.classList.toggle("active",i===(t==="Kalendár"?1:t==="Štatistiky"?2:t==="Faktúry"?3:t==="Nastavenia"?5:0)))}
function backupData(){const data={version:3,app:"Pracovné hodiny",savedAt:new Date().toISOString(),projects:ps,travelTrips,invoices};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Pracovne_hodiny_zaloha.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreData(event){const file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.projects))throw new Error("bad");if(!confirm("Obnoviť uložené údaje? Aktuálne údaje sa nahradia zálohou."))return;ps=data.projects;travelTrips=Array.isArray(data.travelTrips)?data.travelTrips:[];invoices=Array.isArray(data.invoices)?data.invoices:[];save();saveTravel();saveInvoices();list();alert("Údaje boli obnovené.")}catch(e){alert("Tento súbor nie je platná záloha aplikácie.")}event.target.value=""};reader.readAsText(file)}

const IK="ph_demo_invoices";let invoices=JSON.parse(localStorage.getItem(IK)||"[]");
function saveInvoices(){localStorage.setItem(IK,JSON.stringify(invoices))}
function nextInvoiceNumber(){const year=new Date().getFullYear(),nums=invoices.map(v=>String(v.number||"")).filter(v=>v.startsWith(String(year))).map(v=>parseInt(v.slice(4),10)||0);return String(year)+String(Math.max(0,...nums)+1).padStart(3,"0")}
function invoiceProjectHours(p){const already=invoices.filter(v=>v.projectId===p._id).reduce((n,v)=>n+(+v.billedHours||0),0);const total=(p.days||[]).reduce((n,d)=>n+(+d.hours||0),0);return Math.max(0,total-already)}
function invoiceView(){header("Faktúry");const rows=invoices.slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).map(v=>'<tr><td><b>'+esc(v.number)+'</b></td><td>'+esc(v.customer||"—")+'</td><td>'+esc(v.projectName||"—")+'</td><td>'+fmt(v.totalDue)+' €</td><td>'+esc(v.status||"Vystavená")+'</td><td><button class="light" onclick="showInvoice(\''+v.id+'\')">Otvoriť</button></td></tr>').join("");app.innerHTML='<div class="invoicePage"><section class="invoiceIntro"><div><div class="eyebrow">FAKTURÁCIA PROJEKTOV</div><h2>Faktúry</h2><p>Vytvorenie faktúry z evidovaných hodín a uloženie histórie.</p></div><button class="primary" onclick="newInvoice()">＋ Vytvoriť faktúru</button></section><section class="invoicePanel"><h3>História faktúr</h3>'+(rows?'<div style="overflow:auto"><table class="invoiceTable"><thead><tr><th>Číslo</th><th>Odberateľ</th><th>Projekt</th><th>Na úhradu</th><th>Stav</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="invoiceEmpty">Zatiaľ nemáš vytvorenú žiadnu faktúru.</div>')+'</section></div>'}
function newInvoice(){header("Nová faktúra");const opts=ps.map((p,i)=>'<option value="'+i+'">'+esc(p.name)+' · '+sd(p.start)+' – '+sd(p.end)+'</option>').join("");app.innerHTML='<div class="invoicePage"><section class="invoiceIntro"><div><div class="eyebrow">NOVÝ DOKLAD</div><h2>Vytvoriť faktúru</h2><p>Vyber typ fakturácie podľa vykonanej práce.</p></div></section><section class="invoicePanel"><div class="invoiceGrid"><label>Typ faktúry<select id="invMode" onchange="selectInvoiceMode()"><option value="project">SPI – montáž projektu</option><option value="service">SL-Elektromobile – servisné práce</option></select></label><label>Číslo faktúry<input id="invNumber" value="'+nextInvoiceNumber()+'"></label></div><div id="invoiceProjectChooser"><h3>Vyber projekt</h3><label>Projekt<select id="invProject" onchange="loadInvoiceDraft()"><option value="">Vyber projekt</option>'+opts+'</select></label></div><div id="invoiceDraft"></div><div class="invoiceActions"><button class="light" onclick="invoiceView()">Zrušiť</button></div></section></div>';selectInvoiceMode()}
function selectInvoiceMode(){const mode=document.getElementById("invMode").value;document.getElementById("invoiceProjectChooser").style.display=mode==="project"?"":"none";document.getElementById("invoiceDraft").innerHTML="";window.invoiceDraftMode=mode;if(mode==="service")loadServiceInvoiceDraft()}
function loadServiceInvoiceDraft(){window.invoiceDraftProject=null;let saved={};try{saved=JSON.parse(localStorage.getItem("ph_service_customer")||"{}")}catch(e){}document.getElementById("invoiceDraft").innerHTML='<div class="invoiceGrid" style="margin-top:16px"><label>Odberateľ<input id="invCustomer" value="'+esc(saved.customer||"SL-Elektromobile s.r.o.")+'"></label><label>Adresa odberateľa<input id="invAddress" value="'+esc(saved.address||"Mýtna 1269/66, 064 01 Stará Ľubovňa")+'"></label><label>IČO<input id="invIco" value="'+esc(saved.ico||"50774832")+'"></label><label>DIČ / IČ DPH<input id="invDic" value="'+esc(saved.dic||"2120463147 / SK2120463147")+'"></label><label>Číslo objednávky<input id="invOrder" value=""></label><label>Dátum vystavenia<input id="invIssue" type="date" value="'+iso(new Date())+'"></label><label>Dátum dodania<input id="invSupply" type="date" value="'+iso(new Date())+'"></label><label>Dátum splatnosti<input id="invDue" type="date" value="'+iso(new Date(Date.now()+14*86400000))+'"></label></div><section class="invoicePanel" style="padding:16px;margin-top:18px;background:#f7faff"><h3>Servisné práce</h3><div class="invoiceGrid"><label>Názov položky<input id="serviceDescription" value="Servisné práce"></label><label>Počet<input id="serviceQuantity" type="number" min="0.01" step="0.01" value="1"></label><label>Jednotková cena (€)<input id="servicePrice" type="number" min="0" step="0.01" placeholder="Zadaj cenu"></label></div><label>Spôsob úhrady<select id="invPayment"><option>Bankový prevod</option><option>Hotovosť</option></select></label><div class="invoiceTotals" style="margin-top:14px"><div><span>Celkom</span><b id="serviceTotal">0,00 €</b></div><div><span>Záloha</span><input id="serviceAdvance" type="number" min="0" step="0.01" value="0"></div><div class="invoiceGrand"><span>Na úhradu</span><b id="serviceDue">0,00 €</b></div></div><div class="invoiceActions"><button class="primary" onclick="saveServiceInvoice()">Uložiť faktúru</button></div>< function countryAccent(value){const code=countryOptions.some(x=>x[0]===value)?value:null;const palette={SE:"#2879c7",FI:"#36a6c8",NO:"#d94b59",DK:"#c84b62",IS:"#397fbd",NL:"#e47b32",BE:"#d7a52d",DE:"#4c5968",AT:"#cf4545",CH:"#d94b4b",FR:"#426fc2",ES:"#e5a12d",PT:"#24966b",IT:"#26966b",PL:"#d94c55",SK:"#397ac3",CZ:"#3f79b8",HU:"#3b9a70",GB:"#5865b7",IE:"#32966b",LU:"#4e80c7",HR:"#d64e58",SI:"#3a91a2",GR:"#328fc5",RO:"#d3a02c",BG:"#4c9b70",EE:"#397ec0",LV:"#b84f5b",LT:"#4c966b",US:"#4b6fb4",CA:"#d64e58",AE:"#2e9a86",SA:"#27966c",QA:"#8a557c",KW:"#2b9a78",AU:"#4a70ba"};if(code)return palette[code]||"#2585b8";const flag=flagFor(value);const inferred={"🇸🇪":"#2879c7","🇫🇮":"#36a6c8","🇳🇴":"#d94b59","🇳🇱":"#e47b32","🇪🇸":"#e5a12d","🇩🇪":"#4c5968"};return inferred[flag]||"#2585b8"}

function newProjectAdvance(i){const p=ps[i];if(!p)return;const prior=invoices.filter(v=>v.projectId===String(i)&&v.invoiceType==="advance").reduce((s,v)=>s+(+v.subtotal||0),0);header("Zálohová faktúra");app.innerHTML='<div class="invoicePage"><section class="invoicePanel"><h2>Zálohová faktúra – '+esc(p.name)+'</h2><div class="invoiceGrid"><label>Číslo faktúry<input id="advNumber" value="'+nextInvoiceNumber()+'"></label><label>Odberateľ<input id="advCustomer" value="'+esc(p.invoiceCustomer||"")+'"></label><label>Adresa<input id="advAddress" value="'+esc(p.invoiceAddress||"")+'"></label><label>IČO<input id="advIco" value="'+esc(p.invoiceIco||"")+'"></label><label>DIČ / IČ DPH<input id="advDic" value="'+esc(p.invoiceDic||"")+'"></label><label>Číslo objednávky<input id="advOrder" value="'+esc(p.orderNumber||"")+'"></label><label>Dátum vystavenia<input id="advIssue" type="date" value="'+iso(new Date())+'"></label><label>Dátum dodania<input id="advSupply" type="date" value="'+iso(new Date())+'"></label><label>Dátum splatnosti<input id="advDue" type="date" value="'+iso(new Date(Date.now()+14*86400000))+'"></label><label>Výška zálohy (€)<input id="advAmount" type="number" min="0.01" step=".01"></label></div><p class="muted">Predchádzajúce zálohové faktúry: '+fmt(prior)+' €</p><div class="invoiceActions"><button class="light" onclick="render()">Späť na projekt</button><button class="primary" onclick="saveProjectAdvance('+i+')">Vytvoriť zálohovú faktúru</button></div></section></div>'}
function saveProjectAdvance(i){const p=ps[i],amount=Math.max(0,+document.getElementById("advAmount").value||0),number=document.getElementById("advNumber").value.trim(),customer=document.getElementById("advCustomer").value.trim();if(!amount||!number||!customer){alert("Vyplň číslo faktúry, odberateľa a sumu zálohy.");return}if(invoices.some(v=>v.number===number)){alert("Toto číslo faktúry už existuje.");return}const v={id:"inv_"+Date.now(),invoiceType:"advance",number,projectId:String(i),projectName:p.name,billedHours:0,internal:{},customer,address:document.getElementById("advAddress").value,ico:document.getElementById("advIco").value,dic:document.getElementById("advDic").value,order:document.getElementById("advOrder").value,issueDate:document.getElementById("advIssue").value,supplyDate:document.getElementById("advSupply").value,dueDate:document.getElementById("advDue").value,payment:"Bankový prevod",lines:[{description:"Záloha na projekt: "+p.name,quantity:1,unit:"ks",unitPrice:amount,total:amount}],subtotal:amount,advance:0,totalDue:amount,status:"Vystavená",createdAt:new Date().toISOString()};p.invoiceCustomer=v.customer;p.invoiceAddress=v.address;p.invoiceIco=v.ico;p.invoiceDic=v.dic;p.orderNumber=v.order;invoices.push(v);save();saveInvoices();showInvoice(v.id)}
function newProjectFinal(i){newInvoice();document.getElementById("invProject").value=String(i);loadInvoiceDraft();const prior=invoices.filter(v=>v.projectId===String(i)&&v.invoiceType==="advance").reduce((n,v)=>n+(+v.subtotal||0),0);const a=document.getElementById("invAdvance");if(a){a.value=prior;calcInvoice()}window.invoiceDraftType="final";const h=document.querySelector("#invoiceDraft h3");if(h)h.insertAdjacentHTML("beforebegin",'<p class="muted"><b>Konečná faktúra.</b> Automaticky odpočítané zálohové faktúry: '+fmt(prior)+' €</p>')}
function editCountry(){let x=ps[cur];header("Upraviť štát");app.innerHTML=`<section class="projectsPanel projectFormPanel"><div class="panelHeading"><div><div class="eyebrow">ÚPRAVA ZÁKAZKY</div><h2>Štát projektu</h2></div></div><div class="projectForm"><label for="projectCountry">Vyber štát</label><select id="projectCountry" class="countrySelect"><option value="">Vyber štát</option>${countryOptions.map(v=>`<option value="${v[0]}" ${(x.country||"")===v[0]?"selected":""}>${v[1]} ${v[2]}</option>`).join("")}</select><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveCountry()">Uložiť štát</button></div></div></section>`}
function saveCountry(){let country=document.getElementById("projectCountry").value;if(!country){alert("Vyber štát projektu.");return}ps[cur].country=country;save();render()}
function editName(){let x=ps[cur];header("Upraviť názov");app.innerHTML=`<div class="card"><h2>Názov projektu</h2><label>Názov</label><input id="pn" type="text" value="${esc(x.name)}"><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveName()">Uložiť</button></div></div>`;document.getElementById("pn").focus()}
function saveName(){let n=document.getElementById("pn").value.trim();if(!n){alert("Názov projektu nemôže byť prázdny.");return}ps[cur].name=n;save();render()}
function editDates(){let x=ps[cur];header("Upraviť dátumy");app.innerHTML=`<div class="card"><h2>${esc(x.name)}</h2><label>Dátum začiatku projektu</label><input id="ds" type="date" value="${x.start}"><label>Dátum konca projektu</label><input id="de" type="date" value="${x.end}"><p class="muted">Po uložení sa zoznam dní automaticky prispôsobí novému rozsahu. Už zadané hodiny pre existujúce dátumy zostanú zachované.</p><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveDates()">Uložiť</button></div></div>`}
function saveDates(){let ns=document.getElementById("ds").value,ne=document.getElementById("de").value;if(!ns||!ne||D(ne)<D(ns)){alert("Dátumy nie sú správne.");return}let x=ps[cur],old=Object.fromEntries(x.days.map(d=>[d.date,d.hours]));x.start=ns;x.end=ne;x.days=days(ns,ne).map(d=>({date:d.date,hours:old[d.date]||0}));save();render()}
function edit(){let x=ps[cur];header("Upraviť");app.innerHTML=`<section class="projectsPanel projectFormPanel"><div class="panelHeading"><div><div class="eyebrow">ÚPRAVA ZÁKAZKY</div><h2>${esc(x.name)}</h2></div></div><div class="projectForm"><label for="editOrderNo">Číslo objednávky</label><input id="editOrderNo" value="${esc(x.orderNumber||"")}" placeholder="Zadaj číslo objednávky"><label for="editCountry">Štát projektu</label><select id="editCountry" class="countrySelect"><option value="">Vyber štát</option>${countryOptions.map(v=>`<option value="${v[0]}" ${(x.country||"")===v[0]?"selected":""}>${v[1]} ${v[2]}</option>`).join("")}</select><label for="er">Sadzba €/h – platí pre VŠETKY hodiny projektu</label><input id="er" type="number" step=".01" value="${x.rate}"><label for="ea">Záloha €</label><input id="ea" type="number" step=".01" value="${x.advance}"><div class="actions"><button class="light" onclick="render()">Zrušiť</button><button class="primary" onclick="saveEdit()">Uložiť zmeny</button></div></div></section>`}
function saveEdit(){ps[cur].orderNumber=document.getElementById("editOrderNo").value.trim();ps[cur].country=document.getElementById("editCountry").value;ps[cur].rate=+document.getElementById("er").value||0;ps[cur].advance=+document.getElementById("ea").value||0;save();render()}
